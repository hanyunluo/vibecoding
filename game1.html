<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>末路兼職 Dead-End Job - EP1: 深夜超商 (Prototype)</title>
<style>
  * {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background-color: #07050a;
    overflow: hidden;
    touch-action: none;
    font-family: 'Courier New', Courier, 'Noto Sans TC', monospace;
    color: #fff;
  }
  #game-wrapper {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: radial-gradient(circle, #1a1224 0%, #050308 100%);
  }
  canvas {
    width: 100%;
    height: 100%;
    max-width: 177.78vh; /* 16:9 ratio */
    max-height: 56.25vw;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    box-shadow: 0 0 40px rgba(0,0,0,0.9);
    background: #0d0a14;
  }
  /* 虛擬觸控 UI (連接手把時自動淡出) */
  #touch-controls {
    position: absolute;
    bottom: 20px;
    left: 0;
    right: 0;
    height: 180px;
    pointer-events: none;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    padding: 0 35px;
    z-index: 20;
    transition: opacity 0.25s ease;
  }
  #touch-controls.hidden {
    opacity: 0;
  }
  .joystick-zone {
    width: 140px;
    height: 140px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.08);
    border: 3px solid rgba(255, 255, 255, 0.25);
    position: relative;
    pointer-events: auto;
    touch-action: none;
  }
  .joystick-knob {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: rgba(180, 255, 100, 0.65);
    border: 3px solid #000;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
  }
  .action-buttons {
    display: flex;
    gap: 16px;
    align-items: flex-end;
    pointer-events: auto;
  }
  .t-btn {
    width: 68px;
    height: 68px;
    border-radius: 50%;
    border: 3px solid #000;
    color: #fff;
    font-weight: 900;
    font-size: 16px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    box-shadow: 0 4px 0 #000;
    touch-action: none;
  }
  .t-btn:active, .t-btn.active {
    transform: translateY(3px);
    box-shadow: 0 1px 0 #000;
    filter: brightness(1.3);
  }
  .btn-a { background: rgba(46, 204, 113, 0.75); width: 78px; height: 78px; }
  .btn-b { background: rgba(231, 76, 60, 0.75); }
  .btn-x { background: rgba(52, 152, 219, 0.75); }
  .t-btn span { font-size: 10px; opacity: 0.9; }
</style>
</head>
<body>

<div id="game-wrapper">
  <canvas id="gameCanvas" width="960" height="540"></canvas>

  <!-- 跨平台虛擬觸控搖桿與按鍵 -->
  <div id="touch-controls">
    <div class="joystick-zone" id="joyZone">
      <div class="joystick-knob" id="joyKnob"></div>
    </div>
    <div class="action-buttons">
      <div class="t-btn btn-x" id="btnX">X<span>攻擊/次要</span></div>
      <div class="t-btn btn-b" id="btnB">B<span>翻滾閃避</span></div>
      <div class="t-btn btn-a" id="btnA">A<span>互動/確認</span></div>
    </div>
  </div>
</div>

<script>
/**
 * ============================================================================
 * 1. WEB AUDIO SYNTHESIZER (復古怪誕 Funky Bass + 鬼魅滑音 Ooo-ooo + 8-Bit 語音粒子)
 * ============================================================================
 */
class SoundEngine {
  constructor() {
    this.ctx = null;
    this.unlocked = false;
    this.bgmTimer = null;
    this.step = 0;
    this.bossMode = false;
  }

  unlock() {
    if (!this.ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AudioCtx();
    }
    if (this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
    if (!this.unlocked) {
      this.unlocked = true;
      this.startBGM();
    }
  }

  // 播放 8-bit 音效與語音粒子
  playTone(freq, type = 'square', duration = 0.08, vol = 0.15, slideFreq = null) {
    if (!this.ctx || !this.unlocked) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, now);
    if (slideFreq) {
      osc.frequency.exponentialRampToValueAtTime(slideFreq, now + duration);
    }
    gain.gain.setValueAtTime(vol, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(now);
    osc.stop(now + duration);
  }

  playAcceptSFX() {
    this.playTone(523.25, 'square', 0.1, 0.2);
    setTimeout(() => this.playTone(659.25, 'square', 0.1, 0.2), 90);
    setTimeout(() => this.playTone(1046.5, 'square', 0.35, 0.25), 180);
  }

  playCoinSFX() {
    this.playTone(987.77, 'square', 0.06, 0.15);
    setTimeout(() => this.playTone(1318.5, 'square', 0.2, 0.18), 60);
  }

  playVoiceBlip(charType = 'player') {
    if (charType === 'player') {
      this.playTone(190 + Math.random() * 60, 'triangle', 0.045, 0.15);
    } else if (charType === 'creepy') {
      // 崔熙東：高低錯位失真音
      this.playTone(140 + Math.random() * 280, 'sawtooth', 0.06, 0.14);
    } else if (charType === 'spider') {
      // 女蜘蛛怪：虛弱氣音下滑
      this.playTone(520 + Math.random() * 80, 'sine', 0.09, 0.12, 260);
    } else if (charType === 'system') {
      this.playTone(800, 'square', 0.03, 0.1);
    }
  }

  playShockSFX() {
    this.playTone(110, 'sawtooth', 0.6, 0.35, 45);
    this.playTone(117, 'square', 0.6, 0.3, 40);
  }

  startBGM() {
    if (this.bgmTimer) clearInterval(this.bgmTimer);
    // Funky Bass 音階 (C minor / Phrygian 詭異律動)
    const normalBass = [130.8, 0, 130.8, 155.5, 174.6, 0, 196.0, 185.0];
    const bossBass   = [110.0, 110.0, 130.8, 116.5, 146.8, 110.0, 164.8, 155.5];

    this.bgmTimer = setInterval(() => {
      if (!this.ctx || this.ctx.state !== 'running') return;
      const idx = this.step % 8;
      const bassNote = this.bossMode ? bossBass[idx] : normalBass[idx];

      // 1. Funky Bassline
      if (bassNote > 0) {
        this.playTone(bassNote, 'sawtooth', this.bossMode ? 0.14 : 0.18, 0.11);
      }

      // 2. 參考影片標誌性的「嗚～嗚～ (Ooo-ooo)」鬼魅滑音人聲合成
      if (this.step % 16 === 0) {
        const startF = this.bossMode ? 587.3 : 523.2;
        const endF   = this.bossMode ? 698.4 : 659.2;
        this.playTone(startF, 'sine', 0.55, 0.09, endF);
      } else if (this.step % 16 === 4) {
        const startF = this.bossMode ? 659.2 : 587.3;
        const endF   = this.bossMode ? 440.0 : 392.0;
        this.playTone(startF, 'sine', 0.65, 0.09, endF);
      }

      this.step++;
    }, 185);
  }
}

const sfx = new SoundEngine();

/**
 * ============================================================================
 * 2. UNIFIED INPUT MANAGER (原生 Gamepad API + 鍵盤 + iOS/Android 觸控三合一)
 * ============================================================================
 */
class UnifiedInput {
  constructor() {
    this.mode = 'KEYBOARD'; // 'GAMEPAD' | 'TOUCH' | 'KEYBOARD'
    this.axisX = 0;
    this.axisY = 0;
    this.prevAxisX = 0;

    // 動作狀態: A (確認/互動), B (翻滾閃避), X (攻擊/投擲/次要選項)
    this.actions = {
      A: { pressed: false, justPressed: false, _prev: false },
      B: { pressed: false, justPressed: false, _prev: false },
      X: { pressed: false, justPressed: false, _prev: false }
    };

    this.keys = {};
    this.touchState = { x: 0, y: 0, A: false, B: false, X: false };
    this.gamepadIndex = null;

    this.initKeyboard();
    this.initGamepadEvents();
    this.initTouch();
  }

  setMode(newMode) {
    if (this.mode !== newMode) {
      this.mode = newMode;
      const touchEl = document.getElementById('touch-controls');
      if (newMode === 'GAMEPAD') {
        touchEl.classList.add('hidden');
      } else if (newMode === 'TOUCH') {
        touchEl.classList.remove('hidden');
      }
    }
  }

  initKeyboard() {
    window.addEventListener('keydown', (e) => {
      this.keys[e.code] = true;
      if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) {
        e.preventDefault();
      }
      sfx.unlock();
      if (this.mode === 'TOUCH') this.setMode('KEYBOARD');
    });
    window.addEventListener('keyup', (e) => {
      this.keys[e.code] = false;
    });
  }

  initGamepadEvents() {
    window.addEventListener('gamepadconnected', (e) => {
      this.gamepadIndex = e.gamepad.index;
      this.setMode('GAMEPAD');
      this.vibrate(120, 0.5, 0.5);
    });
    window.addEventListener('gamepaddisconnected', () => {
      this.gamepadIndex = null;
      this.setMode('KEYBOARD');
    });
  }

  initTouch() {
    const joyZone = document.getElementById('joyZone');
    const joyKnob = document.getElementById('joyKnob');
    let joyTouchId = null;

    const updateJoy = (clientX, clientY) => {
      const rect = joyZone.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      const maxR = rect.width / 2 - 20;
      let dx = clientX - cx;
      let dy = clientY - cy;
      const dist = Math.hypot(dx, dy);
      if (dist > maxR) {
        dx = (dx / dist) * maxR;
        dy = (dy / dist) * maxR;
      }
      joyKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
      this.touchState.x = Math.abs(dx / maxR) > 0.15 ? dx / maxR : 0;
      this.touchState.y = Math.abs(dy / maxR) > 0.15 ? dy / maxR : 0;
    };

    joyZone.addEventListener('touchstart', (e) => {
      e.preventDefault();
      sfx.unlock();
      this.setMode('TOUCH');
      const t = e.changedTouches[0];
      joyTouchId = t.identifier;
      updateJoy(t.clientX, t.clientY);
    }, { passive: false });

    joyZone.addEventListener('touchmove', (e) => {
      e.preventDefault();
      for (let t of e.changedTouches) {
        if (t.identifier === joyTouchId) updateJoy(t.clientX, t.clientY);
      }
    }, { passive: false });

    const resetJoy = (e) => {
      for (let t of e.changedTouches) {
        if (t.identifier === joyTouchId) {
          joyTouchId = null;
          joyKnob.style.transform = `translate(-50%, -50%)`;
          this.touchState.x = 0;
          this.touchState.y = 0;
        }
      }
    };
    joyZone.addEventListener('touchend', resetJoy);
    joyZone.addEventListener('touchcancel', resetJoy);

    const bindBtn = (id, key) => {
      const el = document.getElementById(id);
      el.addEventListener('touchstart', (e) => {
        e.preventDefault();
        sfx.unlock();
        this.setMode('TOUCH');
        this.touchState[key] = true;
        el.classList.add('active');
      }, { passive: false });
      const end = (e) => {
        e.preventDefault();
        this.touchState[key] = false;
        el.classList.remove('active');
      };
      el.addEventListener('touchend', end);
      el.addEventListener('touchcancel', end);
    };
    bindBtn('btnA', 'A');
    bindBtn('btnB', 'B');
    bindBtn('btnX', 'X');
  }

  // 手把震動回饋 (Dual-Rumble)
  vibrate(durationMs = 100, weak = 0.5, strong = 0.5) {
    if (!navigator.getGamepads) return;
    const pads = navigator.getGamepads();
    const gp = pads[this.gamepadIndex] || pads[0];
    if (gp && gp.vibrationActuator && gp.vibrationActuator.playEffect) {
      gp.vibrationActuator.playEffect('dual-rumble', {
        startDelay: 0,
        duration: durationMs,
        weakMagnitude: weak,
        strongMagnitude: strong
      }).catch(() => {});
    }
  }

  // 每一幀主動輪詢 (Polling in requestAnimationFrame)
  poll() {
    this.prevAxisX = this.axisX;
    let ax = 0, ay = 0;
    let btnA = false, btnB = false, btnX = false;

    // 1. 輪詢 Gamepad API
    const pads = navigator.getGamepads ? navigator.getGamepads() : [];
    let activePad = null;
    for (let i = 0; i < pads.length; i++) {
      if (pads[i] && pads[i].connected) {
        activePad = pads[i];
        break;
      }
    }

    if (activePad) {
      const deadzone = 0.18;
      const rawX = activePad.axes[0] || 0;
      const rawY = activePad.axes[1] || 0;
      const dpadLeft  = activePad.buttons[14]?.pressed;
      const dpadRight = activePad.buttons[15]?.pressed;

      if (Math.abs(rawX) > deadzone) ax = rawX;
      else if (dpadLeft) ax = -1;
      else if (dpadRight) ax = 1;

      if (Math.abs(rawY) > deadzone) ay = rawY;

      // Standard Gamepad Mapping:
      // buttons[0] = A/Cross, buttons[1] = B/Circle, buttons[2] = X/Square, buttons[7] = RT/R2
      const gpA = activePad.buttons[0]?.pressed || activePad.buttons[7]?.pressed;
      const gpB = activePad.buttons[1]?.pressed || activePad.buttons[5]?.pressed;
      const gpX = activePad.buttons[2]?.pressed || activePad.buttons[3]?.pressed;

      if (Math.abs(ax) > 0 || gpA || gpB || gpX) {
        this.setMode('GAMEPAD');
        sfx.unlock();
      }
      btnA = btnA || gpA;
      btnB = btnB || gpB;
      btnX = btnX || gpX;
    }

    // 2. 鍵盤輸入合併
    if (this.keys['ArrowLeft'] || this.keys['KeyA']) ax = -1;
    if (this.keys['ArrowRight'] || this.keys['KeyD']) ax = 1;
    if (this.keys['KeyJ'] || this.keys['KeyZ'] || this.keys['Space'] || this.keys['Enter']) btnA = true;
    if (this.keys['KeyK'] || this.keys['KeyX'] || this.keys['ShiftLeft']) btnB = true;
    if (this.keys['KeyL'] || this.keys['KeyC'] || this.keys['KeyE']) btnX = true;

    // 3. 觸控輸入合併
    if (Math.abs(this.touchState.x) > 0) ax = this.touchState.x;
    if (this.touchState.A) btnA = true;
    if (this.touchState.B) btnB = true;
    if (this.touchState.X) btnX = true;

    this.axisX = ax;
    this.axisY = ay;

    const updateBtn = (act, state) => {
      act.justPressed = state && !act._prev;
      act.pressed = state;
      act._prev = state;
    };
    updateBtn(this.actions.A, btnA);
    updateBtn(this.actions.B, btnB);
    updateBtn(this.actions.X, btnX);
  }

  getPromptLabel(btn) {
    if (this.mode === 'GAMEPAD') {
      return btn === 'A' ? '手把 Ⓐ' : btn === 'B' ? '手把 Ⓑ' : '手把 Ⓧ';
    } else if (this.mode === 'TOUCH') {
      return `觸控 [${btn}]`;
    } else {
      return btn === 'A' ? '[J / Space]' : btn === 'B' ? '[K / Shift]' : '[L / E]';
    }
  }
}

const input = new UnifiedInput();

/**
 * ============================================================================
 * 3. GAME STATE & EPISODE 1 LOGIC (深夜超商：由左至右 2400px 橫向卷軸)
 * ============================================================================
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const STATE = {
  INTRO_PHONE: 0,    // 階段0: 片頭與手機點擊 ACCEPT 解鎖音效
  EXPLORE: 1,        // 階段1~2: 超商橫向卷軸探索
  MANUAL_UI: 2,      // 第一人稱觀看規則手冊
  SPIDER_CHOICE: 3,  // 倉庫女蜘蛛怪抉擇
  CUTIN_REVEAL: 4,   // 崔熙東說溜嘴 + 撕開手冊第二頁 QTE
  BOSS_FIGHT: 5,     // 階段4: 巨大鼠怪生存戰 + 拉扯 QTE + 破窗引陽光
  VICTORY: 6         // 06:00 破曉結算 50倍時薪
};

const game = {
  state: STATE.INTRO_PHONE,
  cameraX: 0,
  worldWidth: 2400,
  salary: 0,
  displaySalary: 0,
  clockMinutes: 22 * 60, // 22:00 起算 (至隔天 06:00 = 30 * 60 = 1800)
  glitchIntensity: 0,
  shakeTimer: 0,
  sunlightProgress: 0, // 0 ~ 1 破曉陽光

  // 劇情旗標
  manualRead: false,
  heedongSpawned: false,
  spiderResolved: false,
  sanityBuff: false, // 詢問女蜘蛛怪獲得的清醒Buff
  secondPageTornProgress: 0,

  // 第一人稱手冊文字
  manualLines: [
    "【蜘蛛人力派遣：深夜超商工作守則】",
    "規則 1：大夜班兼職人員為兩人一組。",
    "規則 2：值班期間（22:00-06:00），絕對不能擅自離開超商。",
    "規則 3：聽到倉庫傳來怪聲，絕對不要進去。",
    "規則 4：如果遇到妖魔鬼怪，倉庫裡有十字架可以對付。"
  ],
  manualRevealedCount: 1,

  // 字幕與對話框
  dialogue: null, // { speaker, text, charIndex, timer, voiceType, onComplete }

  // 主角：卞革浚
  player: {
    x: 220,
    y: 390,
    vx: 0,
    facing: 1,
    hp: 100,
    maxHp: 100,
    dodgeTimer: 0,
    invulnTimer: 0,
    grabbedByRat: false,
    qteEscapeProgress: 0,
    lastShakeSign: 0,
    blindsPullProgress: 0,
    animFrame: 0
  },

  // 偽人同事：崔熙東 / 巨大鼠怪 Boss
  boss: {
    x: 980,
    y: 390,
    active: false,
    transformed: false,
    state: 'IDLE', // 'IDLE' | 'CHARGE' | 'STUNNED'
    vx: 0,
    timer: 0,
    rats: []
  }
};

// 初始化鼠怪身上的蠕動老鼠粒子
for (let i = 0; i < 38; i++) {
  game.boss.rats.push({
    ox: (Math.random() - 0.5) * 110,
    oy: -Math.random() * 135,
    spd: 2 + Math.random() * 4,
    phase: Math.random() * Math.PI * 2
  });
}

// 觸發底部打字機對話
function startDialogue(speaker, text, voiceType = 'player', onComplete = null) {
  game.dialogue = {
    speaker,
    text,
    charIndex: 0,
    timer: 0,
    voiceType,
    onComplete
  };
}

function addSalary(amount) {
  game.salary += amount;
  sfx.playCoinSFX();
}

// 觸發畫面點擊 ACCEPT (支援滑鼠/觸控直接點 Canvas)
canvas.addEventListener('pointerdown', (e) => {
  sfx.unlock();
  if (game.state === STATE.INTRO_PHONE) {
    triggerAcceptJob();
  } else if (game.state === STATE.VICTORY) {
    resetPrototype();
  }
});

function triggerAcceptJob() {
  sfx.playAcceptSFX();
  input.vibrate(200, 0.8, 1.0);
  game.glitchIntensity = 12;
  game.state = STATE.EXPLORE;
  startDialogue(
    "卞革浚",
    "全租房被騙、股票慘賠……為了這 50 倍時薪，今晚死也要撐到早上 6 點！先去收銀台（向右走）看看工作手冊吧。",
    "player"
  );
}

function resetPrototype() {
  game.state = STATE.EXPLORE;
  game.salary = 0;
  game.clockMinutes = 22 * 60;
  game.sunlightProgress = 0;
  game.manualRead = false;
  game.heedongSpawned = false;
  game.spiderResolved = false;
  game.sanityBuff = false;
  game.secondPageTornProgress = 0;
  game.manualRevealedCount = 1;
  game.player.x = 220;
  game.player.hp = 100;
  game.player.grabbedByRat = false;
  game.player.blindsPullProgress = 0;
  game.boss.transformed = false;
  game.boss.x = 980;
  sfx.bossMode = false;
}

/**
 * ============================================================================
 * 4. UPDATE LOOP (核心遊戲與 QTE 邏輯更新)
 * ============================================================================
 */
function update() {
  input.poll();

  if (game.glitchIntensity > 0) game.glitchIntensity *= 0.9;
  if (game.shakeTimer > 0) game.shakeTimer--;
  if (game.displaySalary < game.salary) {
    game.displaySalary += Math.ceil((game.salary - game.displaySalary) * 0.15);
  }

  // 0. 片頭手機接案畫面
  if (game.state === STATE.INTRO_PHONE) {
    if (input.actions.A.justPressed) {
      triggerAcceptJob();
    }
    return;
  }

  // 對話框打字機推進
  if (game.dialogue) {
    game.dialogue.timer++;
    if (game.dialogue.charIndex < game.dialogue.text.length) {
      if (game.dialogue.timer % 2 === 0) {
        game.dialogue.charIndex++;
        sfx.playVoiceBlip(game.dialogue.voiceType);
      }
      if (input.actions.A.justPressed) {
        game.dialogue.charIndex = game.dialogue.text.length;
      }
    } else {
      if (input.actions.A.justPressed) {
        const cb = game.dialogue.onComplete;
        game.dialogue = null;
        if (cb) cb();
      }
    }
    return;
  }

  // 1. 第一人稱觀看規則手冊 UI
  if (game.state === STATE.MANUAL_UI) {
    if (input.actions.A.justPressed) {
      if (game.manualRevealedCount < game.manualLines.length) {
        game.manualRevealedCount++;
        sfx.playVoiceBlip('system');
        input.vibrate(40, 0.3, 0.1);
      } else {
        // 讀完第一頁，崔熙東登場
        game.state = STATE.EXPLORE;
        game.manualRead = true;
        game.heedongSpawned = true;
        game.clockMinutes = 23 * 60 + 30; // 23:30
        addSalary(250000);
        startDialogue(
          "崔熙東 (怪異的同事)",
          "嘿嘿……你就是新來的革浚哥嗎？我守櫃檯就好，倉庫（最右邊 X:2150）好像有怪聲，你去幫我盤點貨物吧～",
          "creepy"
        );
      }
    }
    return;
  }

  // 2. 倉庫女蜘蛛怪心理博弈抉擇
  if (game.state === STATE.SPIDER_CHOICE) {
    if (input.actions.A.justPressed) {
      // 選擇詢問女怪物 -> 獲得清醒理智 Buff
      game.sanityBuff = true;
      game.spiderResolved = true;
      game.clockMinutes = 26 * 60; // 02:00
      addSalary(600000);
      sfx.playVoiceBlip('spider');
      input.vibrate(150, 0.4, 0.6);
      game.state = STATE.EXPLORE;
      startDialogue(
        "倉庫的女蜘蛛怪 (前任工讀生)",
        "（虛弱地劇烈點頭，用蜘蛛步足指向十字架背面的血跡——原來那是崔熙東編造來害死工讀生的假規則！獲得【清醒理智 Buff：跑速與閃避提升】！快往左走出倉庫！）",
        "spider"
      );
    } else if (input.actions.X.justPressed) {
      // 直接拿十字架 -> 被女怪物撞開警告
      game.spiderResolved = true;
      game.clockMinutes = 26 * 60;
      addSalary(300000);
      game.shakeTimer = 15;
      input.vibrate(250, 0.9, 0.9);
      game.state = STATE.EXPLORE;
      startDialogue(
        "卞革浚",
        "哇啊啊！女怪物突然拼死撞開了我的手！十字架背面全是誘捕的血跡……原來手冊上的十字架是陷阱！快往左離開倉庫！",
        "player"
      );
    }
    return;
  }

  // 3. 識破崔熙東 + 狂按 A 撕開手冊第二頁 QTE
  if (game.state === STATE.CUTIN_REVEAL) {
    if (input.actions.A.justPressed) {
      game.secondPageTornProgress += 18;
      game.shakeTimer = 6;
      sfx.playTone(220 + game.secondPageTornProgress * 4, 'sawtooth', 0.06, 0.2);
      input.vibrate(60, 0.6, 0.8);
    }
    game.secondPageTornProgress = Math.max(0, game.secondPageTornProgress - 0.25);

    if (game.secondPageTornProgress >= 100) {
      // 撕開成功！崔熙東化身巨大鼠怪 Boss 戰開始！
      sfx.playShockSFX();
      sfx.bossMode = true;
      input.vibrate(500, 1.0, 1.0);
      game.glitchIntensity = 25;
      game.shakeTimer = 35;
      game.boss.transformed = true;
      game.boss.x = 1550;
      game.boss.state = 'CHARGE';
      game.boss.timer = 60;
      game.clockMinutes = 28 * 60 + 30; // 04:30
      game.state = STATE.BOSS_FIGHT;
      startDialogue(
        "超商手冊第二頁 (血字)",
        "【警告：第二名兼職生不是人！！！】崔熙東的身體炸裂成無數隻嗜血老鼠！撐到早上 06:00，並在 05:50 時衝到最左側大門拉開遮光捲簾！",
        "creepy"
      );
    }
    return;
  }

  // 4. 破曉勝利畫面
  if (game.state === STATE.VICTORY) {
    if (input.actions.A.justPressed) {
      resetPrototype();
    }
    return;
  }

  // ==========================================================================
  // 橫向卷軸移動與 Boss 戰邏輯 (STATE.EXPLORE & STATE.BOSS_FIGHT)
  // ==========================================================================
  const p = game.player;
  p.animFrame++;

  if (p.invulnTimer > 0) p.invulnTimer--;
  if (p.dodgeTimer > 0) p.dodgeTimer--;

  // 若被鼠怪抓住：《潛水員戴夫》式左右搖晃左搖桿 QTE
  if (p.grabbedByRat) {
    const sign = Math.sign(input.axisX);
    if (sign !== 0 && sign !== p.lastShakeSign) {
      p.lastShakeSign = sign;
      p.qteEscapeProgress += 16;
      sfx.playTone(300 + p.qteEscapeProgress * 3, 'square', 0.04, 0.15);
      input.vibrate(40, 0.5, 0.5);
    }
    if (input.actions.A.justPressed || input.actions.B.justPressed) {
      p.qteEscapeProgress += 10;
    }
    p.hp -= 0.12;
    if (p.qteEscapeProgress >= 100) {
      // 掙脫成功！
      p.grabbedByRat = false;
      p.invulnTimer = 60;
      p.vx = -10;
      game.boss.state = 'STUNNED';
      game.boss.timer = 55;
      addSalary(400000);
      sfx.playAcceptSFX();
    }
  } else {
    // 正常橫向移動與翻滾閃避
    const baseSpeed = game.sanityBuff ? 6.2 : 5.0;
    if (input.actions.B.justPressed && p.dodgeTimer === 0) {
      p.dodgeTimer = 22;
      p.invulnTimer = game.sanityBuff ? 32 : 24;
      p.vx = p.facing * 11;
      sfx.playTone(180, 'triangle', 0.12, 0.2, 90);
    }

    if (p.dodgeTimer > 0) {
      p.x += p.vx;
      p.vx *= 0.92;
    } else {
      p.vx = input.axisX * baseSpeed;
      p.x += p.vx;
      if (Math.abs(input.axisX) > 0.1) {
        p.facing = Math.sign(input.axisX);
      }
    }
  }

  // 邊界限制 (未讀手冊前不能進最右側倉庫)
  const maxRight = game.manualRead ? 2320 : 1750;
  p.x = Math.max(90, Math.min(maxRight, p.x));

  // 鏡頭平滑跟隨
  const targetCamX = Math.max(0, Math.min(game.worldWidth - canvas.width, p.x - canvas.width * 0.4));
  game.cameraX += (targetCamX - game.cameraX) * 0.12;

  // --------------------------------------------------------------------------
  // 探索階段互動節點判定 (STATE.EXPLORE)
  // --------------------------------------------------------------------------
  if (game.state === STATE.EXPLORE) {
    // 節點 A: 收銀台工作手冊 (X: 700)
    if (!game.manualRead && Math.abs(p.x - 700) < 90 && input.actions.A.justPressed) {
      game.state = STATE.MANUAL_UI;
      sfx.playVoiceBlip('system');
    }

    // 節點 B: 貨架區快速補貨賺外快 (X: 1300)
    if (Math.abs(p.x - 1300) < 85 && input.actions.A.justPressed) {
      addSalary(50000);
      input.vibrate(30, 0.2, 0.2);
    }

    // 節點 C: 倉庫深處發現女蜘蛛怪與十字架 (X: 2150)
    if (game.manualRead && !game.spiderResolved && Math.abs(p.x - 2150) < 110 && input.actions.A.justPressed) {
      sfx.playShockSFX();
      game.glitchIntensity = 15;
      game.state = STATE.SPIDER_CHOICE;
    }

    // 節點 D: 走出倉庫遇到崔熙東說溜嘴 (X < 1550)
    if (game.spiderResolved && p.x < 1550) {
      sfx.playShockSFX();
      game.glitchIntensity = 18;
      startDialogue(
        "崔熙東",
        "革浚哥，盤點完了嗎？倉庫裡的那個「女人」……還乖嗎？",
        "creepy",
        () => {
          startDialogue(
            "卞革浚 (內心驚駭)",
            "等等……我根本沒跟他說倉庫裡的是「女人」！！快狂按確認鍵撕開工作手冊黏住的第二頁！",
            "player",
            () => {
              game.state = STATE.CUTIN_REVEAL;
            }
          );
        }
      );
    }
  }

  // --------------------------------------------------------------------------
  // Boss 戰階段邏輯 (STATE.BOSS_FIGHT: 04:30 撐到 06:00 並拉開最左側捲簾)
  // --------------------------------------------------------------------------
  if (game.state === STATE.BOSS_FIGHT) {
    // 時間推進 (約 35 秒從 04:30 走到 05:55)
    if (game.clockMinutes < 29 * 60 + 55) {
      game.clockMinutes += 0.045;
    }

    const b = game.boss;
    b.timer--;

    // 玩家按 X 拿十字架/滅火器砸鼠怪 (還原劇情：常規武器只會讓老鼠散開又重組，-0 HP)
    if (input.actions.X.justPressed && Math.abs(p.x - b.x) < 220) {
      b.state = 'STUNNED';
      b.timer = 35;
      game.shakeTimer = 8;
      sfx.playTone(150, 'square', 0.1, 0.25, 60);
      input.vibrate(80, 0.6, 0.4);
    }

    if (b.state === 'STUNNED') {
      if (b.timer <= 0) {
        b.state = 'CHARGE';
        b.timer = 90;
      }
    } else if (b.state === 'CHARGE') {
      const dir = Math.sign(p.x - b.x);
      b.vx = dir * 4.3;
      b.x += b.vx;

      // 碰撞判定
      if (!p.grabbedByRat && p.invulnTimer <= 0 && Math.abs(p.x - b.x) < 68) {
        p.grabbedByRat = true;
        p.qteEscapeProgress = 0;
        game.shakeTimer = 18;
        game.glitchIntensity = 14;
        sfx.playShockSFX();
        input.vibrate(300, 0.9, 1.0);
      }
    }

    // 破曉決戰：當時間到達 05:50 (1790分) 後，最左側大門 (X < 230) 解鎖拉捲簾 QTE！
    if (game.clockMinutes >= 29 * 60 + 50 && p.x < 240 && !p.grabbedByRat) {
      if (input.actions.A.justPressed || input.actions.X.justPressed) {
        p.blindsPullProgress += 22;
        game.shakeTimer = 8;
        sfx.playTone(400 + p.blindsPullProgress * 5, 'square', 0.08, 0.25);
        input.vibrate(90, 0.8, 0.9);

        if (p.blindsPullProgress >= 100) {
          // 06:00 破曉金光照射！鼠怪灰飛煙滅！
          game.clockMinutes = 30 * 60; // 06:00
          game.sunlightProgress = 1;
          addSalary(2750000); // 湊滿 400萬韓元 50倍高薪
          sfx.playAcceptSFX();
          sfx.bossMode = false;
          input.vibrate(600, 1.0, 1.0);
          game.state = STATE.VICTORY;
        }
      }
    }

    // 若血量歸零則自動觸發腎上腺素保底回血 (讓製作人順暢測試全流程)
    if (p.hp <= 0) {
      p.hp = 50;
      p.grabbedByRat = false;
      p.invulnTimer = 90;
      game.glitchIntensity = 20;
    }
  }
}

/**
 * ============================================================================
 * 5. RENDER ENGINE (粗黑外框像素美術 + 漫畫網點 + RGB 色差濾鏡)
 * ============================================================================
 */
function formatClock(totalMin) {
  const m = Math.floor(totalMin) % (24 * 60);
  const hh = String(Math.floor(m / 60)).padStart(2, '0');
  const mm = String(m % 60).padStart(2, '0');
  return `${hh}:${mm}`;
}

// 繪製粗黑框像素矩形輔助函式
function drawPixelRect(x, y, w, h, fill, outline = '#000', lineW = 3) {
  ctx.fillStyle = fill;
  ctx.fillRect(Math.floor(x), Math.floor(y), Math.floor(w), Math.floor(h));
  if (outline) {
    ctx.strokeStyle = outline;
    ctx.lineWidth = lineW;
    ctx.strokeRect(Math.floor(x), Math.floor(y), Math.floor(w), Math.floor(h));
  }
}

function drawPlayer(x, y, p) {
  ctx.save();
  ctx.translate(Math.floor(x), Math.floor(y));
  if (p.invulnTimer > 0 && Math.floor(p.invulnTimer / 3) % 2 === 0) {
    ctx.globalAlpha = 0.45;
  }
  const bob = Math.abs(p.vx) > 0.2 ? Math.sin(p.animFrame * 0.35) * 4 : 0;
  ctx.scale(p.facing, 1);

  // 雙腿
  drawPixelRect(-14, -28 + bob, 11, 28, '#1c2833');
  drawPixelRect(3, -28 - bob, 11, 28, '#1c2833');

  // 卞革浚標誌性「黑白條紋長袖」身體
  drawPixelRect(-18, -74 + bob, 36, 48, '#ecf0f1');
  ctx.fillStyle = '#111';
  for (let sy = -68; sy < -30; sy += 10) {
    ctx.fillRect(-16, sy + bob, 32, 5);
  }

  // 頭部與亂髮
  drawPixelRect(-16, -110 + bob, 32, 36, '#f5cba7');
  drawPixelRect(-19, -118 + bob, 38, 14, '#111'); // 蓬亂黑髮

  // 粗框眼鏡與濃重黑眼圈
  drawPixelRect(0, -98 + bob, 14, 10, '#fff', '#000', 3);
  ctx.fillStyle = '#000';
  ctx.fillRect(6, -95 + bob, 4, 4);
  ctx.fillStyle = '#5b2c6f'; // 熬夜黑眼圈
  ctx.fillRect(0, -87 + bob, 13, 3);

  ctx.restore();
}

function drawHeedongOrRatBoss(b) {
  ctx.save();
  ctx.translate(Math.floor(b.x), Math.floor(b.y));

  if (!b.transformed) {
    // 偽人同事：崔熙東 (脖子詭異歪斜抽搐)
    const twitch = Math.sin(Date.now() * 0.02) * 3;
    drawPixelRect(-14, -28, 11, 28, '#111');
    drawPixelRect(3, -28, 11, 28, '#111');
    drawPixelRect(-18, -76, 36, 48, '#2ecc71'); // 超商綠背心
    // 歪斜 35 度的詭異頭部
    ctx.save();
    ctx.translate(twitch, -85);
    ctx.rotate(0.32 + Math.sin(Date.now() * 0.015) * 0.12);
    drawPixelRect(-16, -26, 32, 34, '#d5dbdb');
    drawPixelRect(-18, -32, 36, 12, '#111');
    // 詭異紅眼與裂嘴笑
    ctx.fillStyle = '#ff0044';
    ctx.fillRect(-10, -14, 6, 6);
    ctx.fillRect(4, -14, 6, 6);
    ctx.fillStyle = '#000';
    ctx.fillRect(-10, -2, 20, 4);
    ctx.restore();
  } else {
    // 巨大聚合鼠怪 Boss (由無數蠕動黑紅老鼠與紅眼組成)
    const scatter = b.state === 'STUNNED' ? 28 : 0;
    drawPixelRect(-55, -145, 110, 145, '#2c0b1e', '#000', 4);

    for (let r of b.rats) {
      const rx = r.ox + Math.sin(Date.now() * 0.01 * r.spd + r.phase) * (10 + scatter);
      const ry = r.oy + Math.cos(Date.now() * 0.01 * r.spd + r.phase) * (8 + scatter);
      drawPixelRect(rx - 14, ry - 10, 28, 18, '#1a1118', '#000', 2);
      // 猩紅鼠眼
      ctx.fillStyle = '#ff1144';
      ctx.fillRect(rx - 8, ry - 5, 5, 5);
    }

    if (b.state === 'STUNNED') {
      ctx.fillStyle = '#ffeb3b';
      ctx.font = 'bold 18px monospace';
      ctx.fillText('常規武器無效 (-0 HP)！快去左邊拉窗簾！', -160, -165);
    }
  }
  ctx.restore();
}

function render() {
  ctx.save();

  // 震動與 RGB 色差偏移
  if (game.shakeTimer > 0) {
    ctx.translate((Math.random() - 0.5) * 12, (Math.random() - 0.5) * 12);
  }

  // ==========================================================================
  // 階段 0：像素片頭動畫與第一人稱手機點擊 [ACCEPT]
  // ==========================================================================
  if (game.state === STATE.INTRO_PHONE) {
    ctx.fillStyle = '#0c0714';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // 紫色漫畫網點背景 (Halftone Dots)
    ctx.fillStyle = 'rgba(142, 68, 173, 0.16)';
    for (let x = 0; x < canvas.width; x += 24) {
      for (let y = 0; y < canvas.height; y += 24) {
        ctx.fillRect(x, y, 6, 6);
      }
    }

    // 漢江大橋與主角剪影
    ctx.fillStyle = '#1b112c';
    ctx.fillRect(0, 340, canvas.width, 200);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 22px monospace';
    ctx.fillText('《末路兼職 꿀알바》EP1：深夜超商 (50倍時薪的生死煉獄)', 40, 50);
    ctx.fillStyle = '#bdc3c7';
    ctx.font = '16px monospace';
    ctx.fillText('全租房詐騙、股票崩盤……正當卞革浚站在大橋邊準備投江時，手機突然響起詭異的簡訊聲：', 40, 85);

    // 第一人稱雙手拿手機特寫 (還原參考影片 00:00:02)
    const px = 310, py = 120, pw = 340, ph = 380;
    drawPixelRect(px - 35, py + 120, 45, 190, '#e59866'); // 左手大拇指
    drawPixelRect(px + pw - 10, py + 140, 45, 190, '#e59866'); // 右手
    drawPixelRect(px, py, pw, ph, '#1c2833', '#000', 5); // 手機外框
    drawPixelRect(px + 18, py + 24, pw - 36, ph - 48, '#11171d', '#000', 3); // 螢幕

    // 蜘蛛人力派遣 Logo 與金幣
    ctx.fillStyle = '#f1c40f';
    ctx.font = 'bold 24px monospace';
    ctx.fillText('🕷️ 蜘蛛人力派遣 (거미인력)', px + 36, py + 72);
    ctx.fillStyle = '#ecf0f1';
    ctx.font = '16px monospace';
    ctx.fillText('職缺：偏僻深夜超商大夜班', px + 38, py + 115);
    ctx.fillText('時間：22:00 - 06:00 (撐到日出)', px + 38, py + 145);
    ctx.fillStyle = '#ff5252';
    ctx.font = 'bold 20px monospace';
    ctx.fillText('時薪：50 倍 (₩ 4,000,000)', px + 38, py + 185);

    // 閃爍綠光的 ACCEPT 大按鈕
    const pulse = Math.sin(Date.now() * 0.008) * 6;
    drawPixelRect(px + 45 - pulse/2, py + 235 - pulse/2, pw - 90 + pulse, 74 + pulse, '#2ecc71', '#000', 4);
    ctx.fillStyle = '#000';
    ctx.font = 'bold 28px monospace';
    ctx.fillText('[ ACCEPT 接下工作 ]', px + 58, py + 282);

    ctx.fillStyle = '#a2ff00';
    ctx.font = 'bold 16px monospace';
    ctx.fillText(`👉 按下 ${input.getPromptLabel('A')} 或直接點擊螢幕解鎖 BGM 與配音開始遊戲！`, px - 70, py + 355);

    ctx.restore();
    return;
  }

  // ==========================================================================
  // 繪製 2400px 由左至右橫向卷軸超商場景
  // ==========================================================================
  ctx.save();
  ctx.translate(-Math.floor(game.cameraX), 0);

  // 背景牆面 (超商區 vs 最右側禁忌倉庫區)
  ctx.fillStyle = '#1b2631';
  ctx.fillRect(0, 0, 1850, 400);
  ctx.fillStyle = '#120914'; // 倉庫陰暗紫黑背景
  ctx.fillRect(1850, 0, 550, 400);

  // 地板
  drawPixelRect(0, 390, 2400, 150, '#2c3e50', '#000', 4);

  // [最左側 X: 80] 超商玻璃大門與防曬遮光捲簾 (破曉決戰關鍵點)
  drawPixelRect(80, 90, 180, 300, game.sunlightProgress > 0 ? '#f9e79f' : '#0b132b', '#000', 4);
  const blindHeight = 290 * (1 - game.player.blindsPullProgress / 100);
  drawPixelRect(85, 95, 170, blindHeight, '#34495e', '#000', 3);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 15px monospace';
  ctx.fillText('超商大門 (遮光捲簾)', 95, 75);

  if (game.state === STATE.BOSS_FIGHT && game.clockMinutes >= 29 * 60 + 50) {
    // 05:50 窗縫透出金光提示！
    ctx.fillStyle = 'rgba(255, 215, 0, 0.35)';
    ctx.fillRect(80, 90, 220, 300);
    ctx.fillStyle = '#ffeb3b';
    ctx.font = 'bold 18px monospace';
    ctx.fillText(`☀️ 05:50 陽光到了！狂按 ${input.getPromptLabel('A')} 扯下遮光捲簾！`, 60, 45);
  }

  // [左中區 X: 650] 收銀台與《超商工作手冊》
  drawPixelRect(620, 260, 200, 130, '#e67e22', '#000', 4);
  drawPixelRect(680, 232, 50, 28, '#f1c40f', '#000', 3); // 泛黃手冊
  if (!game.manualRead) {
    ctx.fillStyle = '#a2ff00';
    ctx.font = 'bold 16px monospace';
    ctx.fillText(`📖 工作手冊 (${input.getPromptLabel('A')} 閱讀)`, 610, 210);
  }

  // [右中區 X: 1180] 超商貨架走廊
  for (let sx of [1120, 1380]) {
    const broken = game.boss.transformed && Math.abs(game.boss.x - sx) < 180;
    drawPixelRect(sx, broken ? 240 : 130, 160, broken ? 150 : 260, '#2980b9', '#000', 4);
    ctx.fillStyle = '#fff';
    ctx.font = '14px monospace';
    ctx.fillText(broken ? '💥 被鼠怪撞毀的貨架' : '飲料零食貨架', sx + 15, 115);
  }

  // [最右側 X: 1850~2350] 禁忌倉庫鐵門與女蜘蛛怪容器
  drawPixelRect(1830, 60, 35, 330, '#7f8c8d', '#000', 4);
  ctx.fillStyle = '#ff5252';
  ctx.font = 'bold 16px monospace';
  ctx.fillText('⚠️ 倉庫重地 (怪聲來源)', 1880, 90);

  // 牆上誘捕用的假十字架
  drawPixelRect(2080, 140, 18, 70, '#f39c12', '#000', 3);
  drawPixelRect(2062, 158, 54, 18, '#f39c12', '#000', 3);

  // 角落容器裡的「女蜘蛛怪 (前任工讀生)」
  const spTwitch = Math.sin(Date.now() * 0.015) * 4;
  drawPixelRect(2160, 250, 130, 140, '#4a235a', '#000', 4); // 容器
  // 蜘蛛節肢與女工讀生頭顱
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 5;
  for (let leg = -2; leg <= 2; leg++) {
    ctx.beginPath();
    ctx.moveTo(2225, 260);
    ctx.lineTo(2225 + leg * 35, 200 + spTwitch);
    ctx.lineTo(2225 + leg * 55, 280);
    ctx.stroke();
  }
  drawPixelRect(2205, 215 + spTwitch, 36, 36, '#d7bde2', '#000', 3);
  if (game.manualRead && !game.spiderResolved) {
    ctx.fillStyle = '#a2ff00';
    ctx.font = 'bold 16px monospace';
    ctx.fillText(`🕷️ 調查女怪物與十字架 (${input.getPromptLabel('A')})`, 2020, 120);
  }

  // 繪製崔熙東 / 巨大鼠怪 Boss
  if (game.heedongSpawned || game.boss.transformed) {
    drawHeedongOrRatBoss(game.boss);
  }

  // 繪製主角卞革浚
  drawPlayer(game.player.x, game.player.y, game.player);

  // 若被鼠怪抓住，顯示頭頂搖桿掙脫提示
  if (game.player.grabbedByRat) {
    drawPixelRect(game.player.x - 130, game.player.y - 175, 260, 38, '#000', '#ff0044', 3);
    drawPixelRect(game.player.x - 126, game.player.y - 171, 2.52 * game.player.qteEscapeProgress, 30, '#ff0044', null);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 15px monospace';
    ctx.fillText('🕹️ 左右狂搖左搖桿 / 連打 A 掙脫鼠群！', game.player.x - 122, game.player.y - 150);
  }

  ctx.restore();

  // ==========================================================================
  // RGB 色差與漫畫網點故障濾鏡 (Glitch Overlay)
  // ==========================================================================
  if (game.glitchIntensity > 0.5) {
    ctx.fillStyle = 'rgba(255, 0, 80, 0.18)';
    ctx.fillRect((Math.random() - 0.5) * 20, 0, canvas.width, canvas.height);
    ctx.fillStyle = 'rgba(0, 220, 255, 0.15)';
    ctx.fillRect(0, (Math.random() - 0.5) * 15, canvas.width, canvas.height);
  }

  // ==========================================================================
  // 頂部 HUD：電子鐘 (22:00 -> 06:00)、50倍薪資跳表、連線狀態
  // ==========================================================================
  drawPixelRect(20, 16, 230, 56, '#111', '#fff', 3);
  ctx.fillStyle = game.state === STATE.BOSS_FIGHT ? '#ff5252' : '#2ecc71';
  ctx.font = 'bold 26px monospace';
  ctx.fillText(`🕒 ${formatClock(game.clockMinutes)}`, 34, 52);
  ctx.fillStyle = '#bdc3c7';
  ctx.font = '12px monospace';
  ctx.fillText('目標: 撐到 06:00 日出', 150, 48);

  // HP 與 Buff 狀態
  drawPixelRect(265, 16, 220, 28, '#111', '#fff', 2);
  drawPixelRect(268, 19, 2.14 * game.player.hp, 22, '#e74c3c', null);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 14px monospace';
  ctx.fillText(`HP ${Math.ceil(game.player.hp)}% ${game.sanityBuff ? '⚡[清醒理智Buff]' : ''}`, 276, 35);

  // 右上角韓元薪資跳表
  drawPixelRect(canvas.width - 310, 16, 290, 56, '#111', '#f1c40f', 3);
  ctx.fillStyle = '#f1c40f';
  ctx.font = 'bold 24px monospace';
  ctx.fillText(`₩ ${game.displaySalary.toLocaleString()}`, canvas.width - 295, 52);

  // 輸入裝置動態狀態列
  ctx.fillStyle = '#a2ff00';
  ctx.font = 'bold 13px monospace';
  ctx.fillText(`輸入模式: ${input.mode} (支援手把/觸控/鍵盤無縫切換)`, 265, 64);

  // ==========================================================================
  // 特殊第一人稱彈窗 UI：閱讀規則手冊 / 女蜘蛛怪抉擇 / 撕開第二頁 QTE / 破曉結算
  // ==========================================================================
  if (game.state === STATE.MANUAL_UI) {
    ctx.fillStyle = 'rgba(0,0,0,0.82)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    drawPixelRect(140, 70, 680, 390, '#fcf3cf', '#000', 5);
    ctx.fillStyle = '#111';
    for (let i = 0; i < game.manualRevealedCount; i++) {
      ctx.font = i === 0 ? 'bold 22px monospace' : 'bold 18px monospace';
      ctx.fillStyle = i === 4 ? '#c0392b' : '#111';
      ctx.fillText(game.manualLines[i], 175, 130 + i * 56);
    }
    // 右下角被黑血黏住的翻頁角標伏筆
    drawPixelRect(640, 395, 160, 45, '#2c0b1e', '#000', 3);
    ctx.fillStyle = '#ff5252';
    ctx.font = '13px monospace';
    ctx.fillText('🩸 第二頁被血漬黏住了', 650, 422);

    ctx.fillStyle = '#27ae60';
    ctx.font = 'bold 18px monospace';
    ctx.fillText(`👉 按 ${input.getPromptLabel('A')} 逐條浮現守則 (${game.manualRevealedCount}/${game.manualLines.length})`, 175, 425);
  }

  if (game.state === STATE.SPIDER_CHOICE) {
    ctx.fillStyle = 'rgba(15, 0, 25, 0.88)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    drawPixelRect(120, 90, 720, 350, '#1a0924', '#ff0055', 4);
    ctx.fillStyle = '#ff5252';
    ctx.font = 'bold 24px monospace';
    ctx.fillText('🕷️ 驚悚遭遇：容器裡的「蜘蛛變異女工讀生」！', 155, 145);
    ctx.fillStyle = '#ecf0f1';
    ctx.font = '17px monospace';
    ctx.fillText('牆上掛著手冊寫的「十字架」，但眼前的女蜘蛛怪卻拼命對你發出悲鳴……', 155, 195);

    drawPixelRect(155, 235, 650, 65, '#1e8449', '#000', 3);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 18px monospace';
    ctx.fillText(`${input.getPromptLabel('A')} 詢問女怪物：「這十字架能用來對付外面的崔熙東嗎？」`, 175, 274);

    drawPixelRect(155, 320, 650, 65, '#922b21', '#000', 3);
    ctx.fillStyle = '#fff';
    ctx.fillText(`${input.getPromptLabel('X')} 相信工作手冊，直接伸手去拿牆上的十字架！`, 175, 359);
  }

  if (game.state === STATE.CUTIN_REVEAL) {
    ctx.fillStyle = 'rgba(20, 0, 10, 0.9)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    // 滿版漫畫特寫 Cut-in
    drawPixelRect(110, 80, 740, 370, '#fff', '#000', 5);
    ctx.fillStyle = '#c0392b';
    ctx.font = 'bold 28px monospace';
    ctx.fillText('❗ 崔熙東暴露了！他早就知道倉庫裡是「女人」！', 140, 145);
    ctx.fillStyle = '#111';
    ctx.font = 'bold 20px monospace';
    ctx.fillText('快狂按確認鍵撕開《超商工作手冊》被血黏住的第二頁！', 140, 200);

    drawPixelRect(160, 245, 640, 54, '#222', '#000', 4);
    drawPixelRect(164, 249, 6.32 * game.secondPageTornProgress, 46, '#e74c3c', null);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 22px monospace';
    ctx.fillText(`狂按 ${input.getPromptLabel('A')} 撕開血漬頁面 (${Math.floor(game.secondPageTornProgress)}%)`, 260, 280);
  }

  if (game.state === STATE.VICTORY) {
    ctx.fillStyle = 'rgba(255, 235, 150, 0.92)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    drawPixelRect(140, 80, 680, 380, '#111', '#f1c40f', 5);
    ctx.fillStyle = '#f1c40f';
    ctx.font = 'bold 30px monospace';
    ctx.fillText('☀️ 06:00 破曉闖關成功！陽光消滅了巨大鼠怪！', 175, 150);
    ctx.fillStyle = '#ecf0f1';
    ctx.font = '18px monospace';
    ctx.fillText('卞革浚滿身是血地癱坐在灑滿陽光的超商地板上，手機響起入帳通知：', 175, 205);
    ctx.fillStyle = '#2ecc71';
    ctx.font = 'bold 34px monospace';
    ctx.fillText(`💰 實領 50 倍時薪：₩ ${game.salary.toLocaleString()}`, 175, 275);
    ctx.fillStyle = '#a2ff00';
    ctx.font = 'bold 18px monospace';
    ctx.fillText(`👉 按 ${input.getPromptLabel('A')} 或點擊螢幕重新體驗 EP1 原型`, 175, 385);
  }

  // 底部打字機對話框
  if (game.dialogue) {
    drawPixelRect(60, 385, 840, 130, 'rgba(10, 8, 18, 0.94)', '#fff', 4);
    ctx.fillStyle = '#f1c40f';
    ctx.font = 'bold 19px monospace';
    ctx.fillText(`【${game.dialogue.speaker}】`, 85, 420);
    ctx.fillStyle = '#fff';
    ctx.font = '17px monospace';
    const sub = game.dialogue.text.slice(0, game.dialogue.charIndex);
    ctx.fillText(sub.slice(0, 44), 85, 455);
    if (sub.length > 44) {
      ctx.fillText(sub.slice(44), 85, 482);
    }
    ctx.fillStyle = '#a2ff00';
    ctx.font = 'bold 14px monospace';
    ctx.fillText(`按 ${input.getPromptLabel('A')} 繼續 ▶`, 740, 498);
  }

  ctx.restore();
}

function gameLoop() {
  update();
  render();
  requestAnimationFrame(gameLoop);
}

requestAnimationFrame(gameLoop);
</script>
</body>
</html>
