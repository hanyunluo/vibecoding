<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>《末路兼職》Stage 1 復古像素風整合版</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; touch-action: none; }
        body {
            margin: 0; padding: 0; background-color: #0b0b10; color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            width: 100vw; height: 100vh; overflow: hidden; position: fixed;
        }

        #fullscreen-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(11, 11, 16, 0.95); z-index: 9999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; padding: 20px; transition: opacity 0.3s ease;
        }
        #fullscreen-overlay.hidden { opacity: 0; pointer-events: none; }
        
        .btn-enter {
            background: #00d2d3; color: #0b0b10; border: none; padding: 14px 28px;
            font-size: 18px; font-weight: bold; border-radius: 30px; cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 210, 211, 0.4); margin-top: 20px;
        }

        #ui-header {
            width: 98vw; max-width: 960px; display: flex; justify-content: space-between; align-items: center;
            background: #161622; padding: 8px 16px; border-radius: 10px; margin-bottom: 6px;
            border: 1px solid #2a2a40; font-size: 13px; font-weight: bold; z-index: 10;
        }
        .status-group { display: flex; align-items: center; gap: 8px; }
        .dot { width: 10px; height: 10px; border-radius: 50%; background: #ff4757; display: inline-block; }
        .dot.connected { background: #2ed573; box-shadow: 0 0 8px #2ed573; }
        
        #canvas-container {
            width: 98vw; max-width: 960px; aspect-ratio: 16 / 9;
            background: #12121c; border: 2px solid #2a2a40; border-radius: 10px;
            overflow: hidden; position: relative; box-shadow: 0 8px 24px rgba(0,0,0,0.6);
        }
        
        /* 關鍵：強制 Canvas 像素點對齊，拒絕模糊插值 */
        canvas {
            width: 100%; height: 100%; display: block;
            image-rendering: optimizeSpeed;
            image-rendering: -moz-crisp-edges;
            image-rendering: -o-crisp-edges;
            image-rendering: -webkit-optimize-contrast;
            image-rendering: pixelated;
            -ms-interpolation-mode: nearest-neighbor;
        }

        #footer-hint {
            width: 98vw; max-width: 960px; font-size: 11px; color: #787898;
            margin-top: 6px; text-align: center; line-height: 1.3; z-index: 10;
        }
    </style>
</head>
<body>

    <div id="fullscreen-overlay">
        <h2 style="margin-bottom: 10px; color: #00d2d3;">《末路兼職》Stage 1 像素風版</h2>
        <p style="color: #a4b0be; font-size: 14px; max-width: 400px; line-height: 1.5;">
            已全面導入 16-bit 像素藝術規格與無鋸齒 (Pixelated) 渲染管線。請點擊進入全螢幕。
        </p>
        <button class="btn-enter" onclick="enterFullscreenGame()">🎮 進入像素超商</button>
    </div>

    <div id="ui-header">
        <div class="status-group">
            <span id="status-dot" class="dot"></span>
            <span id="status-text">良值手把等待連線...</span>
        </div>
        <div class="status-group">
            <span>🧠 SAN 值: <span id="san-val" style="color:#ff4757;">100</span> / 100</span>
            <button onclick="enterFullscreenGame()" style="background:#2a2a40; color:#fff; border:none; padding:4px 10px; border-radius:6px; font-size:11px; cursor:pointer; margin-left: 10px;">全螢幕</button>
        </div>
    </div>

    <div id="canvas-container">
        <canvas id="gameCanvas" width="960" height="540"></canvas>
    </div>

    <div id="footer-hint">
        🎮 像素風操作指南：左搖桿移動 ｜ A 鍵互動（打卡/收銀/補貨） ｜ X 鍵倉庫躲藏（LT/RT 呼吸調節）
    </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// 強制 2D Context 啟動像素鄰近插值 (Nearest Neighbor)
ctx.imageSmoothingEnabled = false;

const statusDot = document.getElementById('status-dot');
const statusText = document.getElementById('status-text');
const sanValSpan = document.getElementById('san-val');
const overlay = document.getElementById('fullscreen-overlay');

let activeGamepadIndex = null;
const DEADZONE = 0.15;

function enterFullscreenGame() {
    const elem = document.documentElement;
    if (elem.requestFullscreen) { elem.requestFullscreen().catch(() => {}); }
    else if (elem.webkitRequestFullscreen) { elem.webkitRequestFullscreen(); }
    if (screen.orientation && screen.orientation.lock) {
        screen.orientation.lock('landscape').catch(() => {});
    }
    overlay.classList.add('hidden');
    if (!gameState.story.active && gameState.story.queue.length > 0) {
        showNextStory();
    }
}

// 像素風美術資產清單 (Pixel Assets Specs)
const ASSETS = {
    bg_store_interior:     "assets/textures/bg_store_interior.png",     // 960x540
    ui_hiding_vignette:    "assets/textures/ui_hiding_vignette.png",    // 960x540
    fx_crt_scanlines:      "assets/textures/fx_crt_scanlines.png",      // 960x540
    ui_vignette_pulse:     "assets/ui/ui_vignette_pulse.png",           // 960x540
    ui_breathing_bar_bg:   "assets/ui/ui_breathing_bar_bg.png",         // 200x20
    ui_breathing_safe_zone:"assets/ui/ui_breathing_safe_zone.png",      // 80x16
    ui_breathing_pointer:  "assets/ui/ui_breathing_pointer.png",        // 8x24
    ui_barcode_normal:     "assets/ui/ui_barcode_normal.png",           // 128x64
    ui_barcode_corrupted:  "assets/ui/ui_barcode_corrupted.png",        // 128x64
    player_sprites:        "assets/characters/player_part_timer/spritesheet.png" // 32x32 per frame
};

const images = {};
for (let k in ASSETS) {
    images[k] = new Image();
    images[k].src = ASSETS[k];
}

// 遊戲狀態模型
const gameState = {
    stage_id: "stage_01_convenience_store",
    player: {
        id: "player_part_timer",
        move_speed: 180,
        san_current: 100,
        san_max: 100,
        state: "IDLE",
        x: 100,
        y: 420,
        width: 48,
        height: 64,
        facing: 1,
        animFrame: 0,
        animTimer: 0
    },
    san_system: { current_tier: 0 },
    hiding_mechanic: {
        breathe_current: 50.0,
        base_decay_rate: 5.0,
        lt_gain: 15.0,
        rt_loss: 15.0,
        safe_zone: { min: 35.0, max: 65.0 },
        overload_timer_sec: 0.0,
        overload_threshold_sec: 1.5,
        penalty_san: 30
    },
    nodes: [
        { id: "node_entrance_gate", x: 60, width: 80, action: "ACTION_CLOCK_OUT", btn: "A", name: "大門打卡" },
        { id: "node_cash_register", x: 280, width: 100, action: "ACTION_CHECKOUT_QTE", btn: "A", name: "收銀台" },
        { id: "node_shelf_area", x: 580, width: 140, action: "ACTION_RESTOCK", btn: "A", name: "商品貨架" },
        { id: "node_warehouse_door", x: 880, width: 90, action: "ACTION_HIDE_TOGGLE", btn: "X", name: "倉庫門(躲藏)" }
    ],
    qte: { active: false, timer: 0, duration: 1.5, success: false },
    story: {
        active: false,
        speaker: "",
        text: "",
        queue: [
            { speaker: "主角（大夜班兼職）", text: "「這像素風的超商夜班... 總覺得背後有一雙眼睛正盯著貨架看。」" },
            { speaker: "系統提示", text: "【像素任務】：移動至指定節點按 A 互動；進入倉庫後按 X 躲藏並以手把 LT/RT 調節呼吸。" }
        ]
    },
    gameOver: false,
    cameraX: 0,
    worldWidth: 1200,
    flashRed: 0
};

function showNextStory() {
    if (gameState.story.queue.length > 0) {
        const next = gameState.story.queue.shift();
        gameState.story.active = true;
        gameState.story.speaker = next.speaker;
        gameState.story.text = next.text;
    } else {
        gameState.story.active = false;
    }
}

// 鍵盤備援
const keys = { left: false, right: false };
window.addEventListener('keydown', (e) => {
    if (gameState.story.active) {
        if (e.key === ' ' || e.key === 'Enter' || e.key === 'a') { showNextStory(); }
        return;
    }
    if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
    if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); triggerAction("A"); }
    if (e.key === 'x' || e.key === 'X') { triggerAction("X"); }
});
window.addEventListener('keyup', (e) => {
    if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
    if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
});

window.addEventListener("gamepadconnected", (e) => {
    activeGamepadIndex = e.gamepad.index;
    statusDot.classList.add('connected');
    statusText.innerText = `已連線: ${e.gamepad.id.slice(0, 16)}`;
});
window.addEventListener("gamepaddisconnected", (e) => {
    if (activeGamepadIndex === e.gamepad.index) {
        activeGamepadIndex = null;
        statusDot.classList.remove('connected');
        statusText.innerText = "手把已斷線";
    }
});

let lastTime = performance.now();
let prevBtnA = false;
let prevBtnX = false;

function applyDeadzone(val) { return Math.abs(val) < DEADZONE ? 0 : val; }

function triggerRumble(duration, weak, strong) {
    const gps = navigator.getGamepads ? navigator.getGamepads() : [];
    const gp = gps[activeGamepadIndex];
    if (gp && gp.vibrationActuator && gp.vibrationActuator.playEffect) {
        gp.vibrationActuator.playEffect("dual-rumble", {
            startDelay: 0, duration: duration, weakMagnitude: weak, strongMagnitude: strong
        }).catch(() => {});
    }
}

function pollGamepad(dt) {
    const gps = navigator.getGamepads ? navigator.getGamepads() : [];
    for (let i = 0; i < gps.length; i++) { if (gps[i]) { activeGamepadIndex = i; break; } }
    const gp = gps[activeGamepadIndex];
    if (!gp) {
        if (!gameState.story.active) {
            let moveDir = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
            updatePlayerMovement(moveDir, dt);
        }
        return;
    }

    if (!statusDot.classList.contains('connected')) {
        statusDot.classList.add('connected');
        statusText.innerText = `已連線: ${gp.id.slice(0, 16)}`;
    }

    const btnA = gp.buttons[1]?.pressed || false;
    const btnX = gp.buttons[3]?.pressed || false;

    if (gameState.story.active) {
        if (btnA && !prevBtnA) { showNextStory(); }
        prevBtnA = btnA;
        return;
    }

    const lx = applyDeadzone(gp.axes[0] || 0);
    const dpadLeft = gp.buttons[14]?.pressed || false;
    const dpadRight = gp.buttons[15]?.pressed || false;
    let moveDir = lx;
    if (dpadLeft) moveDir = -1;
    if (dpadRight) moveDir = 1;

    updatePlayerMovement(moveDir, dt);

    if (btnA && !prevBtnA) { triggerAction("A"); }
    prevBtnA = btnA;

    if (btnX && !prevBtnX) { triggerAction("X"); }
    prevBtnX = btnX;

    if (gameState.player.state === "HIDING") {
        updateBreathing(dt, gp);
    }
}

function updatePlayerMovement(dir, dt) {
    const p = gameState.player;
    if (gameState.qte.active || p.state === "HIDING" || gameState.gameOver) return;

    if (Math.abs(dir) > 0.05) {
        p.state = "WALK";
        p.x += dir * p.move_speed * dt;
        p.facing = dir > 0 ? 1 : -1;
        p.animTimer += dt * 8;
        if (p.animTimer >= 0.15) {
            p.animFrame = (p.animFrame + 1) % 4;
            p.animTimer = 0;
        }
    } else {
        p.state = "IDLE";
        p.animTimer += dt * 6;
        if (p.animTimer >= 0.25) {
            p.animFrame = (p.animFrame + 1) % 4;
            p.animTimer = 0;
        }
    }
    p.x = Math.max(30, Math.min(gameState.worldWidth - 30, p.x));
}

function getActiveNode() {
    const p = gameState.player;
    for (let node of gameState.nodes) {
        if (p.x >= node.x - node.width/2 && p.x <= node.x + node.width/2) { return node; }
    }
    return null;
}

function triggerAction(btnName) {
    const p = gameState.player;
    const node = getActiveNode();

    if (p.state === "HIDING") {
        if (btnName === "X") {
            p.state = "IDLE";
            triggerRumble(100, 0.2, 0.2);
        }
        return;
    }

    if (!node) return;

    if (gameState.qte.active) {
        if (node.action === "ACTION_CHECKOUT_QTE" && btnName === node.btn) {
            gameState.qte.success = true;
            triggerRumble(150, 0.8, 0.1);
            endQTE(true);
        }
        return;
    }

    if (node.btn === btnName) {
        if (node.action === "ACTION_CHECKOUT_QTE") {
            startQTE();
        } else if (node.action === "ACTION_HIDE_TOGGLE") {
            p.state = "HIDING";
            gameState.hiding_mechanic.breathe_current = 50.0;
            triggerRumble(200, 0.4, 0.6);
        } else if (node.action === "ACTION_CLOCK_OUT") {
            gameState.story.queue.push({ speaker: "系統提示", text: "【大門打卡】：玻璃窗外浮現一張蒼白的像素人臉，門鎖已被死死封死。" });
            showNextStory();
            triggerRumble(150, 0.3, 0.3);
        } else if (node.action === "ACTION_RESTOCK") {
            applySanGain(10);
            gameState.story.queue.push({ speaker: "主角", text: "JJ「把架上泡麵排整齊了... 暫時忘記了恐懼 (+10 SAN)。」" });
            showNextStory();
            triggerRumble(150, 0.1, 0.5);
        }
    }
}

function startQTE() {
    gameState.qte.active = true;
    gameState.qte.timer = gameState.qte.duration;
    gameState.qte.success = false;
    triggerRumble(100, 0.2, 0.0);
}

function endQTE(success) {
    gameState.qte.active = false;
    if (!success) {
        applySanDamage(15);
        gameState.flashRed = 0.6;
        triggerRumble(500, 0.9, 0.9);
    } else {
        gameState.story.queue.push({ speaker: "系統提示", text: "【結帳完成】：條碼掃描成功，顧客低頭走入夜色中。" });
        showNextStory();
    }
}

function applySanDamage(amount) {
    gameState.player.san_current = Math.max(0, gameState.player.san_current - amount);
    sanValSpan.innerText = gameState.player.san_current;
    if (gameState.player.san_current <= 0) {
        gameState.gameOver = true;
        triggerRumble(800, 1.0, 1.0);
    }
}

function applySanGain(amount) {
    gameState.player.san_current = Math.min(gameState.player.san_max, gameState.player.san_current + amount);
    sanValSpan.innerText = gameState.player.san_current;
}

function updateBreathing(dt, gamepad) {
    const h = gameState.hiding_mechanic;
    h.breathe_current -= h.base_decay_rate * dt;

    const ltValue = gamepad.buttons[6] ? gamepad.buttons[6].value : 0;
    const rtValue = gamepad.buttons[7] ? gamepad.buttons[7].value : 0;

    h.breathe_current += ltValue * h.lt_gain * dt * 3;
    h.breathe_current -= rtValue * h.rt_loss * dt * 3;
    h.breathe_current = Math.max(0, Math.min(100, h.breathe_current));

    const inSafeZone = h.breathe_current >= h.safe_zone.min && h.breathe_current <= h.safe_zone.max;
    if (!inSafeZone) {
        h.overload_timer_sec += dt;
        if (h.overload_timer_sec >= h.overload_threshold_sec) {
            applySanDamage(h.penalty_san);
            triggerRumble(500, 0.9, 0.9);
            gameState.player.state = "IDLE";
            h.overload_timer_sec = 0.0;
        }
    } else {
        h.overload_timer_sec = Math.max(0, h.overload_timer_sec - dt * 2);
    }
}

// SAN 值三階段像素濾鏡特效
function renderSanEffects(ctx) {
    const san = gameState.player.san_current;

    if (san >= 70) gameState.san_system.current_tier = 0;
    else if (san >= 30) gameState.san_system.current_tier = 1;
    else gameState.san_system.current_tier = 2;

    // Tier 1 (30 - 69)：心跳紅光脈衝
    if (gameState.san_system.current_tier === 1) {
        const pulseAlpha = Math.sin(Date.now() / 800) * 0.15 + 0.15;
        ctx.save();
        ctx.globalAlpha = pulseAlpha;
        if (images.ui_vignette_pulse && images.ui_vignette_pulse.complete && images.ui_vignette_pulse.naturalWidth > 0) {
            ctx.drawImage(images.ui_vignette_pulse, 0, 0, canvas.width, canvas.height);
        } else {
            ctx.fillStyle = "rgba(180, 0, 0, 0.35)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }
        ctx.restore();
    }

    // Tier 2 (1 - 29)：CRT 掃描線與復古像素雜訊
    if (gameState.san_system.current_tier === 2) {
        ctx.save();
        ctx.globalAlpha = 0.4;
        if (images.fx_crt_scanlines && images.fx_crt_scanlines.complete && images.fx_crt_scanlines.naturalWidth > 0) {
            ctx.drawImage(images.fx_crt_scanlines, 0, 0, canvas.width, canvas.height);
        } else {
            ctx.fillStyle = "rgba(0, 0, 0, 0.4)";
            for (let y = 0; y < canvas.height; y += 4) {
                ctx.fillRect(0, y, canvas.width, 2);
            }
        }
        ctx.restore();
    }
}

// 像素主渲染迴圈
function mainLoop(timestamp) {
    let dt = (timestamp - lastTime) / 1000;
    if (dt > 0.1) dt = 0.1;
    lastTime = timestamp;

    pollGamepad(dt);

    if (gameState.qte.active && !gameState.story.active) {
        gameState.qte.timer -= dt;
        if (gameState.qte.timer <= 0) { endQTE(false); }
    }

    const targetCamX = gameState.player.x - canvas.width / 2;
    gameState.cameraX += (targetCamX - gameState.cameraX) * 0.1;
    gameState.cameraX = Math.max(0, Math.min(gameState.worldWidth - canvas.width, gameState.cameraX));

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (gameState.gameOver) {
        ctx.fillStyle = "#050508";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#ff4757";
        ctx.font = "bold 28px monospace";
        ctx.textAlign = "center";
        ctx.fillText("【 精神崩潰 · GAME OVER 】", canvas.width / 2, canvas.height / 2 - 20);
        ctx.fillStyle = "#8888a0";
        ctx.font = "14px monospace";
        ctx.fillText("理智歸零，像素黑暗吞噬了你的意識。重新整理以再次挑戰。", canvas.width / 2, canvas.height / 2 + 30);
        requestAnimationFrame(mainLoop);
        return;
    }

    ctx.save();
    ctx.translate(-gameState.cameraX, 0);

    // Z: 0 背景超商內景 (支援 pixel_art 960x540 原畫)
    if (images.bg_store_interior && images.bg_store_interior.complete && images.bg_store_interior.naturalWidth > 0) {
        ctx.drawImage(images.bg_store_interior, 0, 0, gameState.worldWidth, 540);
    } else {
        ctx.fillStyle = "#12121a";
        ctx.fillRect(0, 0, gameState.worldWidth, 540);
        ctx.strokeStyle = "#222233";
        ctx.lineWidth = 2;
        ctx.beginPath();
        for (let x = 0; x < gameState.worldWidth; x += 40) {
            ctx.moveTo(x, 480); ctx.lineTo(x, 540);
        }
        ctx.stroke();
    }

    // 互動節點渲染
    const activeNode = getActiveNode();
    gameState.nodes.forEach(node => {
        const isActive = (node === activeNode && gameState.player.state !== "HIDING" && !gameState.story.active);
        
        ctx.fillStyle = isActive ? "#2c2c44" : "#1a1a26";
        ctx.fillRect(node.x - node.width/2, 380, node.width, 100);
        ctx.strokeStyle = isActive ? "#00d2d3" : "#33334d";
        ctx.lineWidth = isActive ? 2 : 1;
        ctx.strokeRect(node.x - node.width/2, 380, node.width, 100);

        ctx.fillStyle = "#8888a0";
        ctx.font = "12px monospace";
        ctx.textAlign = "center";
        ctx.fillText(node.name, node.x, 365);

        if (isActive) {
            ctx.fillStyle = "#ff4757";
            ctx.beginPath();
            ctx.arc(node.x, 310, 16, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 13px monospace";
            ctx.fillText(node.btn, node.x, 314);
        }
    });

    // 主角像素角色渲染
    const p = gameState.player;
    if (p.state !== "HIDING") {
        ctx.save();
        ctx.translate(p.x, p.y + p.height / 2);
        
        if (images.player_sprites && images.player_sprites.complete && images.player_sprites.naturalWidth > 0) {
            // 像素 Spritesheet 裁切繪製
            const sWidth = 32, sHeight = 32;
            const srcX = Math.floor(p.animFrame) * sWidth;
            const srcY = p.state === "WALK" ? 32 : 0;
            ctx.scale(p.facing, 1);
            ctx.drawImage(images.player_sprites, srcX, srcY, sWidth, sHeight, -p.width/2, -p.height, p.width, p.height);
        } else {
            // 像素風智慧佔位符
            ctx.fillStyle = p.state === "WALK" ? "#00d2d3" : "#2e86de";
            ctx.fillRect(-p.width / 2, -p.height, p.width, p.height);
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(p.facing > 0 ? 10 : -22, -55, 10, 10);
        }
        ctx.restore();
    }

    ctx.restore();

    // QTE 條碼 UI (128x64 像素風)
    if (gameState.qte.active && !gameState.story.active) {
        ctx.save();
        ctx.fillStyle = "rgba(0, 0, 0, 0.8)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const cx = canvas.width / 2, cy = canvas.height / 2 - 30;
        const barcodeImg = (gameState.san_system.current_tier >= 1) ? images.ui_barcode_corrupted : images.ui_barcode_normal;
        
        if (barcodeImg && barcodeImg.complete && barcodeImg.naturalWidth > 0) {
            ctx.drawImage(barcodeImg, cx - 128, cy - 80, 256, 128);
        } else {
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(cx - 100, cy - 40, 200, 50);
            ctx.fillStyle = "#000000";
            ctx.font = "bold 13px monospace";
            ctx.textAlign = "center";
            ctx.fillText(gameState.san_system.current_tier >= 1 ? "|||| [CORRUPTED BARCODE] ||||" : "||| | |||| || | || |||", cx, cy - 10);
        }

        const radius = 50;
        const progress = gameState.qte.timer / gameState.qte.duration;
        ctx.beginPath();
        ctx.arc(cx, cy + 60, radius, -Math.PI / 2, -Math.PI / 2 + (Math.PI * 2 * progress));
        ctx.strokeStyle = "#ff4757";
        ctx.lineWidth = 6;
        ctx.stroke();

        ctx.fillStyle = "#ff4757";
        ctx.beginPath();
        ctx.arc(cx, cy + 60, 20, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 15px monospace";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("A", cx, cy + 60);

        ctx.font = "bold 14px monospace";
        ctx.fillStyle = "#ffffff";
        ctx.textAlign = "center";
        ctx.fillText("【像素收銀 QTE】快速按下 A 鍵！", cx, cy + 130);
        ctx.restore();
    }

    // 躲藏遮罩與呼吸條 UI
    if (p.state === "HIDING") {
        ctx.save();
        if (images.ui_hiding_vignette && images.ui_hiding_vignette.complete && images.ui_hiding_vignette.naturalWidth > 0) {
            ctx.drawImage(images.ui_hiding_vignette, 0, 0, canvas.width, canvas.height);
        } else {
            ctx.fillStyle = "rgba(5, 5, 8, 0.92)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#111116";
            ctx.fillRect(canvas.width/2 - 180, 70, 360, 180);
            ctx.strokeStyle = "#2c1810";
            ctx.lineWidth = 8;
            ctx.strokeRect(canvas.width/2 - 180, 70, 360, 180);
        }

        // 呼吸計量器 UI
        const bx = canvas.width / 2 - 120;
        const by = 340;
        const bw = 240;
        const bh = 20;

        ctx.fillStyle = "#1e1e2d";
        ctx.fillRect(bx, by, bw, bh);
        ctx.strokeStyle = "#444466";
        ctx.lineWidth = 2;
        ctx.strokeRect(bx, by, bw, bh);

        // 安全區 (35% ~ 65%)
        ctx.fillStyle = "rgba(46, 213, 115, 0.4)";
        ctx.fillRect(bx + bw * 0.35, by, bw * 0.30, bh);

        // 指針
        const pointerX = bx + (gameState.hiding_mechanic.breathe_current / 100) * bw;
        ctx.fillStyle = "#ff4757";
        ctx.fillRect(pointerX - 2, by - 4, 4, bh + 8);

        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 13px monospace";
        ctx.textAlign = "center";
        ctx.fillText("【躲藏中】使用 LT (加速) / RT (平緩) 調整呼吸", canvas.width / 2, by + 45);
        ctx.font = "11px monospace";
        ctx.fillStyle = "#8888a0";
        ctx.fillText("按 X 鍵離開倉庫", canvas.width / 2, by + 68);
        ctx.restore();
    }

    // 劇情對話框
    if (gameState.story.active) {
        ctx.save();
        ctx.fillStyle = "rgba(0, 0, 0, 0.85)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const boxW = 720, boxH = 130;
        const boxX = (canvas.width - boxW) / 2;
        const boxY = canvas.height - boxH - 25;

        ctx.fillStyle = "#12121c";
        ctx.fillRect(boxX, boxY, boxW, boxH);
        ctx.strokeStyle = "#00d2d3";
        ctx.lineWidth = 2;
        ctx.strokeRect(boxX, boxY, boxW, boxH);

        ctx.fillStyle = "#00d2d3";
        ctx.font = "bold 15px monospace";
        ctx.textAlign = "left";
        ctx.fillText(gameState.story.speaker, boxX + 20, boxY + 28);

        ctx.fillStyle = "#ffffff";
        ctx.font = "14px monospace";
        ctx.fillText(gameState.story.text, boxX + 20, boxY + 65);

        ctx.fillStyle = "#8888a0";
        ctx.font = "11px monospace";
        ctx.textAlign = "right";
        ctx.fillText("▶ 按 A 鍵或空白鍵繼續", boxX + boxW - 20, boxY + boxH - 12);
        ctx.restore();
    }

    renderSanEffects(ctx);

    if (gameState.flashRed > 0) {
        gameState.flashRed -= dt;
        ctx.fillStyle = `rgba(255, 71, 87, ${gameState.flashRed})`;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    requestAnimationFrame(mainLoop);
}

requestAnimationFrame(mainLoop);
</script>
</body>
</html>
