<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>末路兼職 - Stage 1 驗證模組</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; touch-action: none; }
        body {
            margin: 0; padding: 0; background-color: #0b0b10; color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            width: 100vw; height: 100vh; overflow: hidden; position: fixed;
        }
        #ui-header {
            width: 95vw; max-width: 960px; display: flex; justify-content: space-between; align-items: center;
            background: #161622; padding: 10px 16px; border-radius: 12px; margin-bottom: 8px;
            border: 1px solid #2a2a40; font-size: 14px; font-weight: bold;
        }
        .status-group { display: flex; align-items: center; gap: 8px; }
        .dot { width: 10px; height: 10px; border-radius: 50%; background: #ff4757; display: inline-block; }
        .dot.connected { background: #2ed573; box-shadow: 0 0 8px #2ed573; }
        
        #canvas-container {
            width: 95vw; max-width: 960px; aspect-ratio: 16 / 9;
            background: #12121c; border: 2px solid #2a2a40; border-radius: 12px;
            overflow: hidden; position: relative; box-shadow: 0 8px 24px rgba(0,0,0,0.6);
        }
        canvas { width: 100%; height: 100%; display: block; }

        #footer-hint {
            width: 95vw; max-width: 960px; font-size: 11px; color: #787898;
            margin-top: 8px; text-align: center; line-height: 1.4;
        }
    </style>
</head>
<body>

    <div id="ui-header">
        <div class="status-group">
            <span id="status-dot" class="dot"></span>
            <span id="status-text">良值手把等待連線... (請按任意鍵)</span>
        </div>
        <div class="status-group">
            <span>🧠 SAN 值: <span id="san-val" style="color:#ff4757;">100</span> / 100</span>
        </div>
    </div>

    <div id="canvas-container">
        <canvas id="gameCanvas" width="960" height="540"></canvas>
    </div>

    <div id="footer-hint">
        🎮 操作指南：左搖桿/十字鍵左右走位 ｜ 靠近收銀台(X:280) 按下 A 鍵發動 1.5 秒 QTE ｜ 大門/貨架/倉庫門可互動
    </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const statusDot = document.getElementById('status-dot');
const statusText = document.getElementById('status-text');
const sanValSpan = document.getElementById('san-val');

let activeGamepadIndex = null;
const DEADZONE = 0.15;

// 遊戲資料模型 (對應規格書 Stage 1 JSON)
const gameState = {
    player: {
        x: 100, y: 420, width: 64, height: 96,
        speed: 180, sanCurrent: 100, sanMax: 100,
        state: "IDLE", facing: 1 // 1: 右, -1: 左
    },
    nodes: [
        { id: "node_entrance_gate", x: 60, width: 80, action: "ACTION_CLOCK_OUT", btn: "A", name: "大門打卡" },
        { id: "node_cash_register", x: 280, width: 100, action: "ACTION_CHECKOUT_QTE", btn: "A", name: "收銀台" },
        { id: "node_shelf_area", x: 580, width: 140, action: "ACTION_RESTOCK", btn: "A", name: "商品貨架" },
        { id: "node_warehouse_door", x: 880, width: 90, action: "ACTION_PEEK", btn: "X", name: "倉庫門" }
    ],
    qte: {
        active: false,
        timer: 0,
        duration: 1.5,
        targetBtn: "A",
        success: false
    },
    cameraX: 0,
    worldWidth: 1200,
    vibrationTimer: 0,
    vibrationIntensity: 0,
    flashRed: 0
};

// 鍵盤備援控制
const keys = { left: false, right: false, actionA: false, actionX: false };
window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
    if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
    if (e.key === ' ' || e.key === 'Enter') {
        e.preventDefault(); // 阻止頁面滾動
        triggerAction("A");
    }
});
window.addEventListener('keyup', (e) => {
    if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
    if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
});

// 手把連線事件
window.addEventListener("gamepadconnected", (e) => {
    activeGamepadIndex = e.gamepad.index;
    statusDot.classList.add('connected');
    statusText.innerText = `已連線: ${e.gamepad.id.slice(0, 20)}`;
});
window.addEventListener("gamepaddisconnected", (e) => {
    if (activeGamepadIndex === e.gamepad.index) {
        activeGamepadIndex = null;
        statusDot.classList.remove('connected');
        statusText.innerText = "手把已斷線，請按任意鍵重連";
    }
});

let lastTime = performance.now();
let prevBtnA = false;
let prevBtnX = false;

function applyDeadzone(val) {
    return Math.abs(val) < DEADZONE ? 0 : val;
}

// 觸發手把震動安全封裝
function triggerRumble(duration, weak, strong) {
    const gps = navigator.getGamepads ? navigator.getGamepads() : [];
    const gp = gps[activeGamepadIndex];
    if (gp && gp.vibrationActuator && gp.vibrationActuator.playEffect) {
        gp.vibrationActuator.playEffect("dual-rumble", {
            startDelay: 0, duration: duration,
            weakMagnitude: weak, strongMagnitude: strong
        }).catch(() => {});
    }
    gameState.vibrationTimer = duration / 1000;
    gameState.vibrationIntensity = strong;
}

function pollGamepad(dt) {
    const gps = navigator.getGamepads ? navigator.getGamepads() : [];
    for (let i = 0; i < gps.length; i++) {
        if (gps[i]) { activeGamepadIndex = i; break; }
    }
    const gp = gps[activeGamepadIndex];
    if (!gp) {
        // 無手把時使用鍵盤
        let moveDir = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
        updatePlayerMovement(moveDir, dt);
        if (keys.actionA) { triggerAction("A"); keys.actionA = false; }
        return;
    }

    if (!statusDot.classList.contains('connected')) {
        statusDot.classList.add('connected');
        statusText.innerText = `已連線: ${gp.id.slice(0, 20)}`;
    }

    const lx = applyDeadzone(gp.axes[0] || 0);
    const dpadLeft = gp.buttons[14]?.pressed || false;
    const dpadRight = gp.buttons[15]?.pressed || false;
    
    let moveDir = lx;
    if (dpadLeft) moveDir = -1;
    if (dpadRight) moveDir = 1;

    updatePlayerMovement(moveDir, dt);

    // 良值手把按鍵對應 (Switch 佈局)
    const btnB = gp.buttons[0]?.pressed || false; // Switch B (底部)
    const btnA = gp.buttons[1]?.pressed || false; // Switch A (右側) -> 對應規格書主互動
    const btnX = gp.buttons[3]?.pressed || false; // Switch X (頂部)

    // 上升緣觸發 A 鍵
    if (btnA && !prevBtnA) {
        triggerAction("A");
    }
    prevBtnA = btnA;

    // 上升緣觸發 X 鍵
    if (btnX && !prevBtnX) {
        triggerAction("X");
    }
    prevBtnX = btnX;
}

function updatePlayerMovement(dir, dt) {
    const p = gameState.player;
    if (gameState.qte.active) {
        p.state = "INTERACTING";
        return;
    }

    if (Math.abs(dir) > 0.05) {
        p.state = "WALK";
        p.x += dir * p.speed * dt;
        p.facing = dir > 0 ? 1 : -1;
    } else {
        p.state = "IDLE";
    }

    // 限制在便利商店範圍內 (0 ~ 1200)
    p.x = Math.max(30, Math.min(gameState.worldWidth - 30, p.x));
}

// 檢測當前靠近哪個互動節點
function getActiveNode() {
    const p = gameState.player;
    for (let node of gameState.nodes) {
        // AABB 區間判定
        if (p.x >= node.x - node.width/2 && p.x <= node.x + node.width/2) {
            return node;
        }
    }
    return null;
}

function triggerAction(btnName) {
    const node = getActiveNode();
    if (!node) return;

    if (gameState.qte.active) {
        // QTE 進行中再次按下一律判定為成功拆解
        if (node.action === "ACTION_CHECKOUT_QTE" && btnName === node.btn) {
            gameState.qte.success = true;
            triggerRumble(120, 0.0, 0.8);
            endQTE(true);
        }
        return;
    }

    // 啟動互動
    if (node.btn === btnName) {
        if (node.action === "ACTION_CHECKOUT_QTE") {
            startQTE();
        } else {
            // 一般互動回饋
            triggerRumble(150, 0.2, 0.4);
        }
    }
}

function startQTE() {
    gameState.qte.active = true;
    gameState.qte.timer = gameState.qte.duration;
    gameState.qte.success = false;
    triggerRumble(1500, 0.3, 0.1); // 掃碼微震
}

function endQTE(success) {
    gameState.qte.active = false;
    if (!success) {
        // 失敗扣除 SAN 值
        gameState.player.sanCurrent = Math.max(0, gameState.player.sanCurrent - 15);
        sanValSpan.innerText = gameState.player.sanCurrent;
        gameState.flashRed = 0.6; // 紅色閃爍
        triggerRumble(350, 0.9, 0.9); // 強烈報錯震動
    }
}

// 遊戲主迴圈
function mainLoop(timestamp) {
    let dt = (timestamp - lastTime) / 1000;
    if (dt > 0.1) dt = 0.1; // 防止頁面切換回來時 dt 過大
    lastTime = timestamp;

    // 1. 讀取手把輸入
    pollGamepad(dt);

    // 2. 更新 QTE 計時器
    if (gameState.qte.active) {
        gameState.qte.timer -= dt;
        if (gameState.qte.timer <= 0) {
            endQTE(false);
        }
    }

    // 3. 鏡頭平滑跟隨主角
    const targetCamX = gameState.player.x - canvas.width / 2;
    gameState.cameraX += (targetCamX - gameState.cameraX) * 0.1;
    gameState.cameraX = Math.max(0, Math.min(gameState.worldWidth - canvas.width, gameState.cameraX));

    // --- 畫面渲染 ---
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.save();
    ctx.translate(-gameState.cameraX, 0);

    // 渲染背景地面與便利商店場景
    ctx.fillStyle = "#1e1e2d";
    ctx.fillRect(0, 0, gameState.worldWidth, 540);

    // 地板磁磚線條
    ctx.strokeStyle = "#28283d";
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (let x = 0; x < gameState.worldWidth; x += 60) {
        ctx.moveTo(x, 480); ctx.lineTo(x, 540);
    }
    ctx.stroke();

    // 渲染互動節點
    const activeNode = getActiveNode();
    gameState.nodes.forEach(node => {
        const isActive = (node === activeNode && !gameState.qte.active);
        
        ctx.fillStyle = isActive ? "#3b3b5c" : "#242436";
        ctx.fillRect(node.x - node.width/2, 380, node.width, 100);
        ctx.strokeStyle = isActive ? "#00d2d3" : "#4b4b6b";
        ctx.lineWidth = isActive ? 3 : 1;
        ctx.strokeRect(node.x - node.width/2, 380, node.width, 100);

        // 節點名稱
        ctx.fillStyle = "#a4b0be";
        ctx.font = "12px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(node.name, node.x, 365);

        // 頭頂按鈕提示
        if (isActive) {
            ctx.fillStyle = "#ff4757";
            ctx.beginPath();
            ctx.arc(node.x, 310, 18, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 14px sans-serif";
            ctx.fillText(node.btn, node.x, 315);
        }
    });

    // 渲染主角 (白盒藍色方塊 + 狀態)
    const p = gameState.player;
    ctx.save();
    ctx.translate(p.x, p.y + p.height / 2);
    
    // 主角身體
    ctx.fillStyle = p.state === "WALK" ? "#00d2d3" : "#2e86de";
    ctx.fillRect(-p.width / 2, -p.height, p.width, p.height);
    
    // 眼睛方向
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(p.facing > 0 ? 10 : -22, -75, 12, 12);

    // 狀態文字
    ctx.fillStyle = "#ffffff";
    ctx.font = "12px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(p.state, 0, -p.height - 10);
    ctx.restore();

    ctx.restore(); // 恢復相機位移

    // 4. 渲染 QTE 介面覆蓋層
    if (gameState.qte.active) {
        ctx.save();
        ctx.fillStyle = "rgba(0, 0, 0, 0.4)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // QTE 圓環計時
        const cx = canvas.width / 2;
        const cy = canvas.height / 2 - 30;
        const radius = 45;

        // 外發光環
        ctx.beginPath();
        ctx.arc(cx, cy, radius, 0, Math.PI * 2);
        ctx.strokeStyle = "#33334d";
        ctx.lineWidth = 8;
        ctx.stroke();

        // 剩餘時間進度弧度
        const progress = gameState.qte.timer / gameState.qte.duration;
        ctx.beginPath();
        ctx.arc(cx, cy, radius, -Math.PI / 2, -Math.PI / 2 + (Math.PI * 2 * progress));
        ctx.strokeStyle = "#ff4757";
        ctx.lineWidth = 8;
        ctx.stroke();

        // 中間按鈕提示
        ctx.fillStyle = "#ff4757";
        ctx.beginPath();
        ctx.arc(cx, cy, 26, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 20px sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("A", cx, cy);

        // 提示文字
        ctx.font = "bold 16px sans-serif";
        ctx.fillStyle = "#ffffff";
        ctx.fillText("【收銀掃碼 QTE】快速按下 A 鍵！", cx, cy + 70);
        ctx.restore();
    }

    // 5. 扣血紅色閃爍特效
    if (gameState.flashRed > 0) {
        gameState.flashRed -= dt;
        ctx.fillStyle = `rgba(255, 71, 87, ${gameState.flashRed})`;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    requestAnimationFrame(mainLoop);
}

requestAnimationFrame(mainLoop);
</script>
</body>
</html>
