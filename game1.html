​#ui-header {
width: 98vw; max-width: 960px; display: flex; justify-content: space-between; align-items: center;
background: #0d0d14; padding: 9px 18px; border-radius: 10px; margin-bottom: 6px;

width: 130px; height: 12px; background: #161622; border-radius: 6px;

}
#san-bar-fill { width: 100%; height: 100%; background: linear-gradient(90deg, #ff4757, #ff6b81); transition: width 0.2s ease; }
​#canvas-container {
width: 98vw; max-width: 960px; aspect-ratio: 16 / 9;

​<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;
​const statusDot = document.getElementById('status-dot');
const statusText = document.getElementById('status-text');
const sanValSpan = document.getElementById('san-val');
const sanBarFill = document.getElementById('san-bar-fill');
const taskText = document.getElementById('task-text');
const overlay = document.getElementById('fullscreen-overlay');
const muteBtn = document.getElementById('mute-btn');
​let activeGamepadIndex = null;
const DEADZONE = 0.15;
let heartbeatTimer = 0;
let isAudioMuted = false;
let audioCtx = null;
​// Web Audio API 沉浸聲效合成器
function initAudio() {
if (!audioCtx) {
audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
if (audioCtx.state === 'suspended') {
audioCtx.resume();
}
}
​function toggleAudioMute() {
isAudioMuted = !isAudioMuted;
muteBtn.innerText = isAudioMuted ? "🔇 靜音" : "🔊 音效開啟";
}
​function playSynthBeep(freq, type, duration, vol = 0.1) {
if (isAudioMuted || !audioCtx) return;
try {
const osc = audioCtx.createOscillator();
const gain = audioCtx.createGain();
osc.type = type;
osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
gain.gain.setValueAtTime(vol, audioCtx.currentTime);
gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
osc.connect(gain);
gain.connect(audioCtx.destination);
osc.start();
osc.stop(audioCtx.currentTime + duration);
} catch (e) {}
}
​function playHeartbeatSound(isHighSan) {
if (isAudioMuted || !audioCtx) return;
try {
const now = audioCtx.currentTime;
const osc = audioCtx.createOscillator();
const gain = audioCtx.createGain();
osc.type = 'sine';
osc.frequency.setValueAtTime(50, now);
osc.frequency.exponentialRampToValueAtTime(25, now + 0.15);
gain.gain.setValueAtTime(isHighSan ? 0.18 : 0.45, now);
gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
osc.connect(gain);
gain.connect(audioCtx.destination);
osc.start(now);
osc.stop(now + 0.18);
​setTimeout(() => {
if (isAudioMuted || !audioCtx) return;
const now2 = audioCtx.currentTime;
const osc2 = audioCtx.createOscillator();
const gain2 = audioCtx.createGain();
osc2.type = 'sine';
osc2.frequency.setValueAtTime(40, now2);
osc2.frequency.exponentialRampToValueAtTime(20, now2 + 0.18);
gain2.gain.setValueAtTime(isHighSan ? 0.12 : 0.38, now2);
gain2.gain.exponentialRampToValueAtTime(0.001, now2 + 0.2);
osc2.connect(gain2);
gain2.connect(audioCtx.destination);
osc2.start(now2);
osc2.stop(now2 + 0.2);
}, 150);
} catch (e) {}
}
​function playFootstepSound() {
if (isAudioMuted || !audioCtx) return;
playSynthBeep(100 + Math.random() * 50, 'triangle', 0.04, 0.025);
}
​function playGlitchNoise() {
if (isAudioMuted || !audioCtx) return;
playSynthBeep(70 + Math.random() * 400, 'sawtooth', 0.15, 0.25);
}
​function enterFullscreenGame() {
initAudio();
const elem = document.documentElement;
if (elem.requestFullscreen) { elem.requestFullscreen().catch(() => {}); }
else if (elem.webkitRequestFullscreen) { elem.webkitRequestFullscreen(); }
if (screen.orientation && screen.orientation.lock) {
screen.orientation.lock('landscape').catch(() => {});
}
overlay.classList.add('hidden');
if (!gameState.story.active && gameState.story.queue.length > 0) {
showNextStory();
}
}
​const gameState = {
stage_id: "stage_01_convenience_store",
current_task_idx: 0,
tasks: [
"前往大門打卡鐘簽到",
"前往商品貨架補充熱食",
"前往收銀台為詭異顧客結帳",
"躲入倉庫避開異象追逐",
"撐過大夜班直到天明"
],
player: {
move_speed: 195,
san_current: 100,
san_max: 100,
state: "IDLE",
x: 120,
y: 410,
width: 46,
height: 74,
facing: 1,
animFrame: 0,
animTimer: 0,
footstepTimer: 0
},
san_system: { current_tier: 0 },
hiding_mechanic: {
breathe_current: 50.0,
base_decay_rate: 6.5,
lt_gain: 15.0,
rt_loss: 15.0,
safe_zone: { min: 35.0, max: 65.0 },
overload_timer_sec: 0.0,
overload_threshold_sec: 1.5,
penalty_san: 25
},
nodes: [
{ id: "node_entrance_gate", x: 90, width: 80, action: "ACTION_CLOCK_OUT", btn: "A", name: "大門打卡鐘", task_req: 0 },
{ id: "node_shelf_area", x: 450, width: 140, action: "ACTION_RESTOCK", btn: "A", name: "商品貨架", task_req: 1 },
{ id: "node_cash_register", x: 750, width: 110, action: "ACTION_CHECKOUT_QTE", btn: "A", name: "收銀台", task_req: 2 },
{ id: "node_warehouse_door", x: 1080, width: 90, action: "ACTION_HIDE_TOGGLE", btn: "X", name: "倉庫鐵門(躲藏)", task_req: 3 }
],
qte: { active: false, timer: 0, duration: 1.5, success: false },
story: {
active: false,
speaker: "",
text: "",
queue: [
{ speaker: "主角（大夜班兼職）", text: "「今晚的便利商店空氣中瀰漫著濃烈的鐵鏽與消毒水味... 按照班表，先到大門打卡。」" },
{ speaker: "系統提示", text: "【大夜班指令】：請操作搖桿移動至大門打卡鐘，按下 A 鍵辦理簽到。注意維持理智值！" }
]
},
gameOver: false,
cameraX: 0,
worldWidth: 1200,
flashRed: 0,
flickerLight: 1.0,
anomalyEntity: { x: 750, active: false, opacity: 0 }
};
​function updateTaskHUD() {
taskText.innerText = gameState.tasks[gameState.current_task_idx] || "守護便利商店";
}
​function showNextStory() {
if (gameState.story.queue.length > 0) {
const next = gameState.story.queue.shift();
gameState.story.active = true;
gameState.story.speaker = next.speaker;
gameState.story.text = next.text;
playSynthBeep(650, 'sine', 0.07, 0.08);
} else {
gameState.story.active = false;
}
}
​const keys = { left: false, right: false };
window.addEventListener('keydown', (e) => {
initAudio();
if (gameState.story.active) {
if (e.key === ' ' || e.key === 'Enter' || e.key === 'a' || e.key === 'A') { showNextStory(); }
return;
}
if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); triggerAction("A"); }
if (e.key === 'x' || e.key === 'X') { triggerAction("X"); }
});
window.addEventListener('keyup', (e) => {
if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
});
​window.addEventListener("gamepadconnected", (e) => {
activeGamepadIndex = e.gamepad.index;
statusDot.classList.add('connected');
statusText.innerText = 已連線: ${e.gamepad.id.slice(0, 16)};
playSynthBeep(880, 'sine', 0.1, 0.1);
});
window.addEventListener("gamepaddisconnected", (e) => {
if (activeGamepadIndex === e.gamepad.index) {
activeGamepadIndex = null;
statusDot.classList.remove('connected');
statusText.innerText = "手把已斷線";
}
});
​let lastTime = performance.now();
let prevBtnA = false;
let prevBtnX = false;
​function applyDeadzone(val) { return Math.abs(val) < DEADZONE ? 0 : val; }
​function triggerRumble(duration, weak, strong) {
const gps = navigator.getGamepads ? navigator.getGamepads() : [];
const gp = gps[activeGamepadIndex];
if (gp && gp.vibrationActuator && gp.vibrationActuator.playEffect) {
gp.vibrationActuator.playEffect("dual-rumble", {
startDelay: 0, duration: duration, weakMagnitude: weak, strongMagnitude: strong
}).catch(() => {});
}
}
​function pollGamepad(dt) {
const gps = navigator.getGamepads ? navigator.getGamepads() : [];
for (let i = 0; i < gps.length; i++) { if (gps[i]) { activeGamepadIndex = i; break; } }
const gp = gps[activeGamepadIndex];
if (!gp) {
if (!gameState.story.active) {
let moveDir = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
updatePlayerMovement(moveDir, dt);
}
return;
}
​if (!statusDot.classList.contains('connected')) {
statusDot.classList.add('connected');
statusText.innerText = 已連線: ${gp.id.slice(0, 16)};
}
​const btnA = gp.buttons[1]?.pressed || false;
const btnX = gp.buttons[3]?.pressed || false;
​if (gameState.story.active) {
if (btnA && !prevBtnA) { showNextStory(); }
prevBtnA = btnA;
return;
}
​const lx = applyDeadzone(gp.axes[0] || 0);
const dpadLeft = gp.buttons[14]?.pressed || false;
const dpadRight = gp.buttons[15]?.pressed || false;
let moveDir = lx;
if (dpadLeft) moveDir = -1;
if (dpadRight) moveDir = 1;
​updatePlayerMovement(moveDir, dt);
​if (btnA && !prevBtnA) { triggerAction("A"); }
prevBtnA = btnA;
​if (btnX && !prevBtnX) { triggerAction("X"); }
prevBtnX = btnX;
​if (gameState.player.state === "HIDING") {
updateBreathing(dt, gp);
}
}
​function updatePlayerMovement(dir, dt) {
const p = gameState.player;
if (gameState.qte.active || p.state === "HIDING" || gameState.gameOver) return;
​if (Math.abs(dir) > 0.05) {
p.state = "WALK";
p.x += dir * p.move_speed * dt;
p.facing = dir > 0 ? 1 : -1;
p.animTimer += dt * 10;
if (p.animTimer >= 0.12) {
p.animFrame = (p.animFrame + 1) % 4;
p.animTimer = 0;
}
​p.footstepTimer += dt;
if (p.footstepTimer >= 0.3) {
playFootstepSound();
p.footstepTimer = 0;
}
} else {
p.state = "IDLE";
p.animTimer += dt * 5;
if (p.animTimer >= 0.25) {
p.animFrame = (p.animFrame + 1) % 4;
p.animTimer = 0;
}
}
p.x = Math.max(40, Math.min(gameState.worldWidth - 40, p.x));
}
​function getActiveNode() {
const p = gameState.player;
for (let node of gameState.nodes) {
if (p.x >= node.x - node.width/2 && p.x <= node.x + node.width/2) { return node; }
}
return null;
}
​function triggerAction(btnName) {
const p = gameState.player;
const node = getActiveNode();
​if (p.state === "HIDING") {
if (btnName === "X") {
p.state = "IDLE";
playSynthBeep(320, 'triangle', 0.1, 0.1);
triggerRumble(100, 0.2, 0.2);
if (gameState.current_task_idx === 3) {
gameState.current_task_idx = 4;
updateTaskHUD();
gameState.story.queue.push({ speaker: "主角", text: "「外面的腳步聲消失了... 天色漸漸泛白，我終於撐過這個地獄班了。」" });
showNextStory();
}
}
return;
}
​if (!node) return;
​if (gameState.qte.active) {
if (node.action === "ACTION_CHECKOUT_QTE" && btnName === node.btn) {
gameState.qte.success = true;
playSynthBeep(1250, 'sine', 0.1, 0.2);
triggerRumble(150, 0.8, 0.2);
endQTE(true);
}
return;
}
​if (node.btn === btnName) {
if (node.action === "ACTION_CLOCK_OUT") {
playSynthBeep(850, 'square', 0.15, 0.1);
if (gameState.current_task_idx === 0) {
gameState.current_task_idx = 1;
updateTaskHUD();
}
gameState.story.queue.push({ speaker: "系統廣播", text: "【大門已打卡】：大門自動上鎖。玻璃窗外浮現無數張模糊的像素臉孔... 請前往貨架補貨。」" });
showNextStory();
triggerRumble(200, 0.4, 0.4);
} else if (node.action === "ACTION_RESTOCK") {
playSynthBeep(550, 'sine', 0.15, 0.1);
applySanGain(15);
if (gameState.current_task_idx === 1) {
gameState.current_task_idx = 2;
updateTaskHUD();
}
gameState.story.queue.push({ speaker: "主角", text: "「將冷飲櫃與微波便當排整齊了 (+15 SAN)。但收銀台前突然站著一位沒有面孔的怪客...」" });
showNextStory();
gameState.anomalyEntity.active = true;
triggerRumble(150, 0.1, 0.6);
} else if (node.action === "ACTION_CHECKOUT_QTE") {
startQTE();
} else if (node.action === "ACTION_HIDE_TOGGLE") {
p.state = "HIDING";
gameState.hiding_mechanic.breathe_current = 50.0;
playSynthBeep(240, 'sawtooth', 0.15, 0.15);
triggerRumble(200, 0.4, 0.6);
if (gameState.current_task_idx === 3) {
gameState.story.queue.push({ speaker: "主角", text: "「躲進堆滿紙箱的倉庫了... 透過門縫盯著外面。用 LT / RT 控制心跳與呼吸！」" });
showNextStory();
}
}
}
}
​function startQTE() {
gameState.qte.active = true;
gameState.qte.timer = gameState.qte.duration;
gameState.qte.success = false;
playGlitchNoise();
triggerRumble(100, 0.2, 0.0);
}
​function endQTE(success) {
gameState.qte.active = false;
if (!success) {
applySanDamage(25);
gameState.flashRed = 0.7;
playGlitchNoise();
triggerRumble(600, 1.0, 1.0);
gameState.story.queue.push({ speaker: "系統警告", text: "【掃碼崩潰】：條碼掃描失敗，無面顧客發出刺耳尖叫！SAN 值暴跌！" });
showNextStory();
} else {
if (gameState.current_task_idx === 2) {
gameState.current_task_idx = 3;
updateTaskHUD();
}
gameState.anomalyEntity.active = false;
gameState.story.queue.push({ speaker: "系統提示", text: "【結帳完成】：嗶！怪客緩緩轉身步入黑暗走廊... 快跟隨並躲進倉庫裡！" });
showNextStory();
}
}
​function applySanDamage(amount) {
gameState.player.san_current = Math.max(0, gameState.player.san_current - amount);
sanValSpan.innerText = gameState.player.san_current;
sanBarFill.style.width = ${gameState.player.san_current}%;
if (gameState.player.san_current <= 0) {
gameState.gameOver = true;
playGlitchNoise();
triggerRumble(1000, 1.0, 1.0);
}
}
​function applySanGain(amount) {
gameState.player.san_current = Math.min(gameState.player.san_max, gameState.player.san_current + amount);
sanValSpan.innerText = gameState.player.san_current;
sanBarFill.style.width = ${gameState.player.san_current}%;
}
​function updateBreathing(dt, gamepad) {
const h = gameState.hiding_mechanic;
h.breathe_current -= h.base_decay_rate * dt;
​let ltValue = 0, rtValue = 0;
if (gamepad) {
ltValue = gamepad.buttons[6] ? gamepad.buttons[6].value : 0;
rtValue = gamepad.buttons[7] ? gamepad.buttons[7].value : 0;
}
​if (keys.left) ltValue = 0.8;
if (keys.right) rtValue = 0.8;
​h.breathe_current += ltValue * h.lt_gain * dt * 3.5;
h.breathe_current -= rtValue * h.rt_loss * dt * 3.5;
h.breathe_current = Math.max(0, Math.min(100, h.breathe_current));
​const inSafeZone = h.breathe_current >= h.safe_zone.min && h.breathe_current <= h.safe_zone.max;
if (!inSafeZone) {
h.overload_timer_sec += dt;
if (h.overload_timer_sec >= h.overload_threshold_sec) {
applySanDamage(h.penalty_san);
playGlitchNoise();
triggerRumble(500, 0.9, 0.9);
gameState.player.state = "IDLE";
h.overload_timer_sec = 0.0;
gameState.story.queue.push({ speaker: "心靈重創", text: "【呼吸失控】：急促的喘息聲驚動了門外的異象！" });
showNextStory();
}
} else {
h.overload_timer_sec = Math.max(0, h.overload_timer_sec - dt * 2);
}
}

​// SAN 值心跳共振與三階段視覺濾鏡 (Z: 110)
function renderSanEffects(dt, ctx) {
const san = gameState.player.san_current;
​if (san >= 70) gameState.san_system.current_tier = 0;
else if (san >= 30) gameState.san_system.current_tier = 1;
else gameState.san_system.current_tier = 2;
​heartbeatTimer += dt;
const heartbeatInterval = gameState.san_system.current_tier === 2 ? 0.5 : (gameState.san_system.current_tier === 1 ? 0.95 : 0);
if (heartbeatInterval > 0 && heartbeatTimer >= heartbeatInterval) {
heartbeatTimer = 0;
playHeartbeatSound(gameState.san_system.current_tier === 1);
triggerRumble(gameState.san_system.current_tier === 2 ? 200 : 110, gameState.san_system.current_tier === 2 ? 0.8 : 0.25, 0.12);
}
​// Tier 1 (30 - 69)：心跳紅光脈衝
if (gameState.san_system.current_tier === 1) {
const pulseAlpha = Math.sin(Date.now() / 450) * 0.18 + 0.22;
ctx.save();
ctx.globalAlpha = pulseAlpha;
const grad = ctx.createRadialGradient(canvas.width/2, canvas.height/2, 100, canvas.width/2, canvas.height/2, 550);
grad.addColorStop(0, "rgba(255,0,0,0)");
grad.addColorStop(1, "rgba(210,0,0,0.5)");
ctx.fillStyle = grad;
ctx.fillRect(0, 0, canvas.width, canvas.height);
ctx.restore();
}
​// Tier 2 (1 - 29)：強烈 CRT 掃描線與色彩剝離 / Glitch
if (gameState.san_system.current_tier === 2) {
ctx.save();
ctx.globalAlpha = 0.45;
ctx.fillStyle = "#000000";
for (let y = 0; y < canvas.height; y += 3) {
ctx.fillRect(0, y, canvas.width, 1);
}
ctx.restore();
​if (Math.random() < 0.3) {
ctx.save();
ctx.globalAlpha = 0.3;
ctx.fillStyle = Math.random() > 0.5 ? "rgba(255, 0, 0, 0.4)" : "rgba(131, 52, 206, 0.4)";
const glitchY = Math.random() * canvas.height;
ctx.fillRect(0, glitchY, canvas.width, 20 + Math.random() * 25);
ctx.restore();
}
}
}
​// 主渲染迴圈：10 層 Z-Index 精準管線
function mainLoop(timestamp) {
let dt = (timestamp - lastTime) / 1000;
if (dt > 0.1) dt = 0.1;
lastTime = timestamp;
​pollGamepad(dt);
​if (gameState.qte.active && !gameState.story.active) {
gameState.qte.timer -= dt;
if (gameState.qte.timer <= 0) { endQTE(false); }
}
​const targetCamX = gameState.player.x - canvas.width / 2;
gameState.cameraX += (targetCamX - gameState.cameraX) * 0.1;
gameState.cameraX = Math.max(0, Math.min(gameState.worldWidth - canvas.width, gameState.cameraX));
​ctx.clearRect(0, 0, canvas.width, canvas.height);
​if (gameState.gameOver) {
ctx.fillStyle = "#020205";
ctx.fillRect(0, 0, canvas.width, canvas.height);
ctx.fillStyle = "#ff4757";
ctx.font = "bold 30px monospace";
ctx.textAlign = "center";
ctx.fillText("【 精神崩潰 · GAME OVER 】", canvas.width / 2, canvas.height / 2 - 25);
ctx.fillStyle = "#8888a0";
ctx.font = "14px monospace";
ctx.fillText("理智歸零，你被超商黑暗角落的怪物吞噬。請重新整理網頁再試。", canvas.width / 2, canvas.height / 2 + 25);
requestAnimationFrame(mainLoop);
return;
}
​ctx.save();
ctx.translate(-gameState.cameraX, 0);
​// Z: 0 128-bit 超商背景原畫
if (images.bg_store_interior && images.bg_store_interior.complete && images.bg_store_interior.naturalWidth > 0) {
ctx.drawImage(images.bg_store_interior, 0, 0, gameState.worldWidth, 540);
} else {
draw128BitStoreBackground(ctx, gameState.worldWidth, 540);
}
​// Z: 10 ~ 50 互動節點與設施
const activeNode = getActiveNode();
gameState.nodes.forEach(node => {
const isActive = (node === activeNode && gameState.player.state !== "HIDING" && !gameState.story.active);
​ctx.fillStyle = isActive ? "#2c2c44" : "#12131c";
ctx.fillRect(node.x - node.width/2, 370, node.width, 110);
ctx.strokeStyle = isActive ? "#ff4757" : "#252638";
ctx.lineWidth = isActive ? 2 : 1;
ctx.strokeRect(node.x - node.width/2, 370, node.width, 110);
​ctx.fillStyle = isActive ? "#ffffff" : "#8888a0";
ctx.font = "bold 12px monospace";
ctx.textAlign = "center";
ctx.fillText(node.name, node.x, 355);
​// Z: 80 互動提示 UI
if (isActive) {
ctx.fillStyle = "#ff4757";
ctx.beginPath();
ctx.arc(node.x, 300, 16, 0, Math.PI * 2);
ctx.fill();
ctx.fillStyle = "#ffffff";
ctx.font = "bold 14px monospace";
ctx.fillText(node.btn, node.x, 305);
}
});
​// Z: 40 無面異變顧客
if (gameState.anomalyEntity.active) {
draw128BitAnomalyEntity(ctx, gameState.anomalyEntity.x, 480);
}
​// Z: 30 玩家角色本體
const p = gameState.player;
if (p.state !== "HIDING") {
draw128BitPlayerSprite(ctx, p);
}
​ctx.restore();
​// Z: 90 收銀 QTE 條碼與圓環 UI
if (gameState.qte.active && !gameState.story.active) {
ctx.save();
ctx.fillStyle = "rgba(0, 0, 0, 0.88)";
ctx.fillRect(0, 0, canvas.width, canvas.height);
​const cx = canvas.width / 2, cy = canvas.height / 2 - 30;
​ctx.fillStyle = "#ffffff";
ctx.fillRect(cx - 120, cy - 55, 240, 70);
ctx.fillStyle = "#000000";
ctx.font = "bold 16px monospace";
ctx.textAlign = "center";
ctx.fillText(gameState.san_system.current_tier >= 1 ? "||||| [BLOODY BARCODE] |||||" : "||| | |||| || | || |||", cx, cy - 18);
​const radius = 48;
const progress = gameState.qte.timer / gameState.qte.duration;
ctx.beginPath();
ctx.arc(cx, cy + 65, radius, -Math.PI / 2, -Math.PI / 2 + (Math.PI * 2 * progress));
ctx.strokeStyle = "#ff4757";
ctx.lineWidth = 6;
ctx.stroke();
​ctx.fillStyle = "#ff4757";
ctx.beginPath();
ctx.arc(cx, cy + 65, 20, 0, Math.PI * 2);
ctx.fill();
ctx.fillStyle = "#ffffff";
ctx.font = "bold 16px monospace";
ctx.textAlign = "center";
ctx.textBaseline = "middle";
ctx.fillText("A", cx, cy + 65);
​ctx.font = "bold 14px monospace";
ctx.fillStyle = "#ffffff";
ctx.textAlign = "center";
ctx.fillText("【收銀急迫 QTE】快速按下 A 鍵或空白鍵！", cx, cy + 135);

}
​// Z: 100 第一人稱倉庫躲藏與呼吸檢定 UI
if (p.state === "HIDING") {
ctx.save();
ctx.fillStyle = "rgba(2, 2, 5, 0.97)";
ctx.fillRect(0, 0, canvas.width, canvas.height);
​// 倉庫門木縫觀看框

ctx.fillRect(canvas.width/2 - 210, 45, 420, 230);

​ctx.fillStyle = "#a4b0be";

ctx.textAlign = "center";
ctx.fillText("👀 屏息凝神，透過鐵門縫隙觀察外面的異象腳步...", canvas.width / 2, 160);
​const bx = canvas.width / 2 - 140;

const bw = 280;

}
​// 劇情對話框 UI
if (gameState.story.active) {
ctx.save();
ctx.fillStyle = "rgba(0, 0, 0, 0.9)";
ctx.fillRect(0, 0, canvas.width, canvas.height);
​const boxW = 760, boxH = 135;
const boxX = (canvas.width - boxW) / 2;
const boxY = canvas.height - boxH - 25;

ctx.fillRect(boxX, boxY, boxW, boxH);

ctx.strokeRect(boxX, boxY, boxW, boxH);

}
​// Z: 110 全螢幕 SAN 值後製濾鏡層
renderSanEffects(dt, ctx);
​if (gameState.flashRed > 0) {
gameState.flashRed -= dt;
ctx.fillStyle = rgba(255, 71, 87, ${gameState.flashRed});
ctx.fillRect(0, 0, canvas.width, canvas.height);
}
​requestAnimationFrame(mainLoop);
}
​requestAnimationFrame(mainLoop);
