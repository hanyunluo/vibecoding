<script>

{title:'01 / 走投無路',text:'卞革浚被全租房詐騙與投資失利拖進債務深淵。\n站在江邊的那一晚，他收到一則陌生訊息：\n「蜘蛛人力派遣｜夜班時薪 ×50」'},

{title:'03 / 第一個夜班',text:'收銀機亮起。冰櫃嗡嗡作響。\n店裡的日光燈閃了一下——\n有人在倉庫深處，拖動著什麼東西。'}],
};

function buttonName(i){return ['A','B','X','Y','LB','RB','LT','RT','View','＋','LS','RS','↑','↓','←','→'][i]||`BTN ${i}`}

function nextDialogue(){if(!dlg)return;const full=dlg.arr[dialogIndex];if(dialogChar<full.length){dialogChar=full.length;syncDialogue();return}dialogIndex++;if(dialogIndex>=dlg.arr.length){const done=dlg.after;dlg=null;syncDialogue();if(done)done()}else{dialogChar=0;dialogTick=0;syncDialogue()}}
function updateDialogue(dt){if(!dlg)return;const full=dlg.arr[dialogIndex],old=Math.floor(dialogChar);dialogChar=Math.min(full.length,dialogChar+dt*39);const n=Math.floor(dialogChar);if(n!==old){$('#words').textContent=full.slice(0,n);dialogTick+=n-old;if(dialogTick>=4){dialogTick=0;if(!/[\s，。！？：]/.test(full[n-1]||''))playBeep(520+Math.random()*100,.018,'square',.009)}}}
function portraitKind(){if(!dlg)return'hero';const n=dlg.who;if(n.includes('上一任'))return'spider';if(n.includes('鼠怪'))return'mouse';if(n.includes('崔熙東'))return'coworker';if(n.includes('手冊'))return'book';return'hero'}
function drawPortrait(){if(!dlg)return;const c=pctx,k=portraitKind(),w=portraitCanvas.width,h=portraitCanvas.height,shake=(k==='coworker'&&(flow==='reveal'||flow==='secretManual'||flow==='boss')||k==='mouse')?Math.sin(frame*.9)*1.5:0;c.clearRect(0,0,w,h);c.save();c.translate(shake,0);let bg=c.createLinearGradient(0,0,w,h);bg.addColorStop(0,k==='spider'?'#243337':k==='mouse'?'#301a21':k==='coworker'?'#293033':'#1d2935');bg.addColorStop(1,'#0c1018');c.fillStyle=bg;c.fillRect(0,0,w,h);for(let i=0;i<7;i++){c.globalAlpha=.08;c.fillStyle=k==='spider'?'#abd9b0':'#d5c18d';c.fillRect(i*19+(frame*.2%19),0,1,h)}c.globalAlpha=1;
const r=(x,y,a,b,col)=>{c.fillStyle=col;c.fillRect(Math.round(x),Math.round(y),Math.round(a),Math.round(b))},talk=dlg&&dialogChar<dlg.arr[dialogIndex].length;
// shoulders, jacket and neck
r(9,103,94,38,k==='spider'?'#263d3a':k==='mouse'?'#39252a':k==='coworker'?'#435052':'#554432');r(32,92,48,32,k==='spider'?'#d4c8a8':'#d4ad86');
// silhouette and face
r(24,23,65,73,k==='spider'?'#cbbda9':k==='mouse'?'#715251':k==='coworker'?'#c8b39a':'#d8b28d');r(19,35,6,46,'#222129');r(88,36,6,43,'#222129');
// hair silhouette, character-specific fringe
r(18,18,77,20,k==='spider'?'#182026':k==='mouse'?'#24191f':'#17191f');r(17,27,12,25,'#181a20');r(88,27,11,28,'#181a20');r(28,14,15,11,'#17191f');r(49,14,17,9,'#17191f');r(70,17,14,10,'#17191f');r(34,30,18,5,'#211d22');r(58,29,17,5,'#211d22');
if(k==='hero'){
r(31,47,18,5,'#604b45');r(62,47,18,5,'#604b45');r(34,53,13,5,'#e8d5bd');r(63,53,13,5,'#e8d5bd');r(35,54,6,5,'#1e242a');r(64,54,6,5,'#1e242a');r(31,59,18,5,'#463b3e');r(61,59,18,5,'#463b3e');r(73,77,17,6,'#eee0bf');r(75,78,4,3,'#bd514d');r(44,83,talk?19:13,talk?7:3,'#513237');r(46,84,11,2,'#ede0cf');
}else if(k==='coworker'){

}else if(k==='spider'){

function spawnParticles(x,y,count,color,spread=1){for(let i=0;i<count;i++){const a=Math.random()*Math.PI*2,s=(.35+Math.random()*2.8)*spread;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:.5+Math.random()*1.3,max:.5+Math.random()*1.3,size:1+Math.random()*3,color})}}
function updateEffects(dt){for(const p of particles){p.x+=p.vx*dt*30;p.y+=p.vy*dt*30;p.vy+=.05;p.life-=dt}particles=particles.filter(p=>p.life>0);for(const p of afterimages)p.life-=dt;afterimages=afterimages.filter(p=>p.life>0);for(const d of dust){d.x+=Math.sin(frame*.008+d.p)*d.v;d.y-=d.v*.3;if(d.y<36)d.y=220}for(const drop of rain){drop.y+=drop.s*2.8;drop.x-=drop.s*.8;if(drop.y>H){drop.y=-drop.l;drop.x=Math.random()*W}}if(ripFX>0)ripFX=Math.max(0,ripFX-dt);if(boss.scatter>0)boss.scatter=Math.max(0,boss.scatter-dt)}

function audio(){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return null;const a=playBeep.ac||(playBeep.ac=new AC());if(!a.master){a.master=a.createGain();a.master.gain.value=options.sound ? 0.72 : 0;a.master.connect(a.destination)}if(a.state==='suspended')a.resume();return a}
function startMusic(){try{const a=audio();if(!a||a.ambience)return;a.ambience=[];[[55,'triangle',.028],[82.4,'sine',.018],[110,'triangle',.009]].forEach(([hz,type,gain])=>{const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=hz;g.gain.value=gain;o.connect(g);g.connect(a.master);o.start();a.ambience.push({o,g})})}catch{}}

function updatePadTelemetry(gp){const node=$('#pad-telemetry');if(!node)return;if(!gp){node.textContent=navigator.getGamepads?'已準備好；按一下手把按鍵喚醒。':'此瀏覽器沒有提供 Gamepad API。';return}const down=[];gp.buttons.forEach((b,i)=>{if(b.pressed||b.value>.12)down.push(`${i}${b.value>.15?':'+b.value.toFixed(1):''}`)});node.textContent=`${padId}　${gp.mapping==='standard'?'標準映射':'自訂映射'}　${down.length?'按下：'+down.join(' · '):'無按鍵輸入'}　搖桿 ${((gp.axes?.[0]||0)).toFixed(2)}, ${((gp.axes?.[1]||0)).toFixed(2)}`}
function pollGamepad(){if(!navigator.getGamepads){updatePadTelemetry(null);return}const list=navigator.getGamepads();let gp=null;for(const g of list)if(g){gp=g;break}if(gp){const first=padStatus==='尚未連接手把';padId=gp.id;padStatus=gp.id.length>40?gp.id.slice(0,37)+'…':gp.id;if(first){playBeep(500,.1,'sine');if(mode==='title'||mode==='settings'||mode==='gamepad')renderOverlay()}if(mode==='gamepad')updatePadTelemetry(gp);const ax=gp.axes&&gp.axes.length?gp.axes[0]:0,ay=gp.axes&&gp.axes.length>1?gp.axes[1]:0;const l=gp.buttons[14]?.pressed,r=gp.buttons[15]?.pressed;padInput=(ax<-.28||l?-1:ax>.28||r?1:0);const pressed=i=>!!gp.buttons[i]?.pressed,edge=i=>pressed(i)&&!padPrev[i];
if(waitingForMap){const idx=gp.buttons.findIndex((b,i)=>b.pressed&&!padPrev[i]);if(idx>=0){options.gamepadMap[waitingForMap]=idx;waitingForMap='';saveOptions();padPrev=gp.buttons.map(b=>b.pressed);renderOverlay();return}}
if(!waitingForMap&&mode!=='play'){if(Math.abs(ay)>.65&&padMenuY===0){moveMenu(ay>0?1:-1);padMenuY=Math.sign(ay)}else if(Math.abs(ay)<.25)padMenuY=0;if(edge(12))moveMenu(-1);if(edge(13))moveMenu(1)}
if(edge(options.gamepadMap.confirm)){if(mode==='play'){if(flow==='boss')attack();else interact()}else if(mode==='dead')restart();else if(mode==='pause'||mode==='gamepad'||mode==='title'||mode==='chapters'||mode==='intro'||mode==='rules'||mode==='settings'||mode==='end'){const b=overlay.querySelector('button:focus')||overlay.querySelector('.primary')||overlay.querySelector('[data-do]');if(b)b.click()}}
if(edge(options.gamepadMap.dodge)&&mode==='play')dash();if(edge(options.gamepadMap.plus)){if(mode==='dead')restart();else if(mode==='play'&&!dlg){mode='pause';renderOverlay()}}
padPrev=gp.buttons.map(b=>b.pressed)}else{padInput=0;padId='';padStatus='尚未連接手把';padPrev=[];padMenuY=0;updatePadTelemetry(null)}}
window.addEventListener('gamepadconnected',e=>{padId=e.gamepad.id;padStatus=e.gamepad.id;if(mode==='title'||mode==='settings'||mode==='gamepad')renderOverlay()});window.addEventListener('gamepaddisconnected',()=>{padId='';padStatus='尚未連接手把';padPrev=[];if(mode==='title'||mode==='settings'||mode==='gamepad')renderOverlay()});
window.addEventListener('keydown',e=>{const k=e.key;if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' ','Space'].includes(k))e.preventDefault();keys[k]=true;if(k==='Escape'){if(waitingForMap){waitingForMap='';renderOverlay()}else if(mode==='play'&&!dlg){mode='pause';renderOverlay()}else if(mode==='pause'){mode='play';overlay.classList.remove('open')}return}if(k==='Enter'||k===' '){if(mode==='play'){if(flow==='boss')attack();else interact()}else if(mode==='dead')restart();else{const b=overlay.querySelector('button:focus')||overlay.querySelector('[data-do]');if(b)b.click()}return}if(k==='e'||k==='E'){interact();return}if(k==='Shift')dash();if((k==='ArrowDown'||k==='ArrowUp')&&mode!=='play'){const bs=[...overlay.querySelectorAll('button')];if(bs.length){menuIndex=(menuIndex+(k==='ArrowDown'?1:-1)+bs.length)%bs.length;bs[menuIndex].focus()}}if(k==='ArrowRight'&&mode==='rules'){const b=overlay.querySelector('[data-do="ruleNext"]');if(b)b.click()}});window.addEventListener('keyup',e=>{keys[e.key]=false});
document.querySelectorAll('.touchbtn').forEach(b=>{const h=b.dataset.hold,a=b.dataset.action;b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);if(h)keys[h]=true;if(a==='interact'){if(flow==='boss')attack();else interact()}if(a==='dash')dash()});for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>{if(h)keys[h]=false})});
canvas.addEventListener('pointerdown',()=>{if(dlg)nextDialogue()});
if(save&&save.complete){}setHUD();renderOverlay();requestAnimationFrame(draw);requestAnimationFrame(tick);
})();
</script>
</body>
