<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>良值手把網頁控制器 | VibeCoding</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #00e5ff;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #334155;
      --success: #10b981;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 150vh;
    }
    .container { max-width: 800px; margin: 0 auto; }
    header {
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    h1 { margin: 0; font-size: 22px; display: flex; align-items: center; gap: 10px; }
    .badge {
      font-size: 13px;
      padding: 4px 12px;
      border-radius: 999px;
      background: #f59e0b;
      color: #000;
      font-weight: 700;
    }
    .badge.online { background: var(--success); color: #fff; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .card h2 { margin-top: 0; font-size: 18px; color: var(--accent); }
    .btn-group { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 14px; }
    button, .link-btn {
      padding: 12px 20px;
      border-radius: 8px;
      border: 2px solid var(--accent);
      background: rgba(0, 229, 255, 0.1);
      color: var(--text);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      transition: all 0.15s;
    }
    button:hover, .link-btn:hover, button.gp-hover, .link-btn.gp-hover {
      background: var(--accent);
      color: #000;
      transform: translateY(-2px);
    }
    .log-area {
      margin-top: 14px;
      padding: 12px;
      background: #090d16;
      border-radius: 8px;
      font-family: monospace;
      color: #38bdf8;
      font-size: 14px;
    }

    /* 虛擬滑鼠游標 */
    #vibe-gp-cursor {
      position: fixed;
      top: 50%;
      left: 50%;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: rgba(0, 229, 255, 0.88);
      border: 2.5px solid #fff;
      box-shadow: 0 0 12px rgba(0, 229, 255, 0.9), 0 2px 6px rgba(0,0,0,0.6);
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 2147483647;
      display: none;
      transition: transform 0.08s, background 0.08s;
    }

    /* B 鍵右鍵選單 */
    #vibe-gp-ctx {
      position: fixed;
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid #475569;
      border-radius: 10px;
      padding: 6px 0;
      min-width: 165px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.6);
      z-index: 2147483646;
      display: none;
      font-size: 14px;
    }
    .ctx-item {
      padding: 10px 16px;
      cursor: pointer;
    }
    .ctx-item:hover, .ctx-item.gp-hover {
      background: var(--accent);
      color: #000;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>🎮 良值手把網頁控制器</h1>
    <span id="conn-badge" class="badge">等待按鍵喚醒...</span>
  </header>

  <!-- 快速導航區 -->
  <div class="card">
    <h2>🌐 快速傳送門</h2>
    <p style="font-size: 14px; color: var(--muted); margin-top: 0;">
      你可以用手把將游標移到下方按鈕，按 <strong>A 鍵</strong> 直接跳轉到目標網站：
    </p>
    <div class="btn-group">
      <a href="https://ahaboard.ai/" class="link-btn">🚀 前往 AhaBoard (ahaboard.ai)</a>
      <a href="https://www.google.com" class="link-btn">🔍 前往 Google 搜尋</a>
    </div>
  </div>

  <!-- 操作說明區 -->
  <div class="card">
    <h2>🕹️ 手把操作對照</h2>
    <ul style="margin: 0; padding-left: 20px; font-size: 14px; color: var(--muted);">
      <li><strong>左蘑菇頭 / 十字鍵</strong>：移動藍色鼠標</li>
      <li><strong>右蘑菇頭</strong>：上下滾動網頁</li>
      <li><strong>A 鍵 (右方按鍵)</strong>：模擬滑鼠左鍵（點擊連結或按鈕）</li>
      <li><strong>B 鍵 (下方按鍵)</strong>：模擬滑鼠右鍵（開啟快捷選單）</li>
    </ul>
  </div>

  <!-- 測試互動區 -->
  <div class="card">
    <h2>🧪 本頁互動測試</h2>
    <div class="btn-group">
      <button onclick="logMsg('🎯 成功點擊測試按鈕 A')">測試按鈕 A</button>
      <button onclick="logMsg('🎯 成功點擊測試按鈕 B')">測試按鈕 B</button>
    </div>
    <div id="test-log" class="log-area">等待手把操作中...（請按一下手把任意鍵喚醒鼠標）</div>
  </div>
</div>

<!-- 虛擬游標與右鍵選單 DOM -->
<div id="vibe-gp-cursor"></div>
<div id="vibe-gp-ctx">
  <div class="ctx-item" onclick="history.back(); hideCtx();">⬅️ 返回上一頁</div>
  <div class="ctx-item" onclick="location.reload(); hideCtx();">🔄 重新整理</div>
  <div class="ctx-item" onclick="window.scrollTo({top:0, behavior:'smooth'}); hideCtx();">⬆️ 回到頂部</div>
</div>

<script>
  const cursor = document.getElementById('vibe-gp-cursor');
  const badge = document.getElementById('conn-badge');
  const logEl = document.getElementById('test-log');
  const ctxMenu = document.getElementById('vibe-gp-ctx');

  let curX = window.innerWidth / 2;
  let curY = window.innerHeight / 2;
  const speed = 12;
  const deadzone = 0.16;
  let prevLeft = false;
  let prevRight = false;
  let lastHovered = null;

  function logMsg(msg) {
    logEl.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
  }

  function hideCtx() {
    ctxMenu.style.display = 'none';
  }

  function applyDz(v) {
    return Math.abs(v) < deadzone ? 0 : v;
  }

  window.addEventListener('gamepadconnected', (e) => {
    badge.textContent = '手把已連線';
    badge.classList.add('online');
    cursor.style.display = 'block';
    logMsg('🎮 手把已連線：' + e.gamepad.id);
  });

  window.addEventListener('gamepaddisconnected', () => {
    badge.textContent = '已斷線';
    badge.classList.remove('online');
    cursor.style.display = 'none';
  });

  function loop() {
    const pads = navigator.getGamepads ? navigator.getGamepads() : [];
    const gp = pads[0] || pads[1] || pads[2] || pads[3];

    if (gp) {
      if (cursor.style.display !== 'block') {
        cursor.style.display = 'block';
        badge.textContent = '手把已連線';
        badge.classList.add('online');
      }

      // 1. 移動游標
      let dx = applyDz(gp.axes[0] || 0);
      let dy = applyDz(gp.axes[1] || 0);
      if (gp.buttons[12]?.pressed) dy = -0.7;
      if (gp.buttons[13]?.pressed) dy = 0.7;
      if (gp.buttons[14]?.pressed) dx = -0.7;
      if (gp.buttons[15]?.pressed) dx = 0.7;

      curX = Math.max(0, Math.min(window.innerWidth, curX + dx * speed));
      curY = Math.max(0, Math.min(window.innerHeight, curY + dy * speed));
      cursor.style.left = `${curX}px`;
      cursor.style.top = `${curY}px`;

      // 2. 滾動頁面
      const sx = applyDz(gp.axes[2] || 0);
      const sy = applyDz(gp.axes[3] || 0);
      if (sx !== 0 || sy !== 0) window.scrollBy(sx * 14, sy * 14);

      // 3. Hover 效果
      const target = document.elementFromPoint(curX, curY);
      const clickable = target?.closest('a, button, input, .ctx-item');
      if (lastHovered && lastHovered !== clickable) {
        lastHovered.classList.remove('gp-hover');
      }
      if (clickable) {
        clickable.classList.add('gp-hover');
        lastHovered = clickable;
      }

      // 4. A 鍵點擊 / B 鍵右鍵
      const isLeft = gp.buttons[1]?.pressed || false;  // A 鍵
      const isRight = gp.buttons[0]?.pressed || false; // B 鍵

      if (isLeft && !prevLeft) {
        cursor.style.background = '#ff4081';
        if (target) {
          target.click();
          logMsg(`🎯 點擊了元素: ${target.tagName}`);
        }
        hideCtx();
      } else if (!isLeft && prevLeft) {
        cursor.style.background = 'rgba(0,229,255,0.88)';
      }

      if (isRight && !prevRight) {
        cursor.style.background = '#ffeb3b';
        ctxMenu.style.left = `${Math.min(curX, window.innerWidth - 180)}px`;
        ctxMenu.style.top = `${Math.min(curY, window.innerHeight - 160)}px`;
        ctxMenu.style.display = ctxMenu.style.display === 'block' ? 'none' : 'block';
      } else if (!isRight && prevRight) {
        cursor.style.background = 'rgba(0,229,255,0.88)';
      }

      prevLeft = isLeft;
      prevRight = isRight;
    }
    requestAnimationFrame(loop);
  }

  requestAnimationFrame(loop);
</script>

</body>
</html>
